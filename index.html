<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>카페 데니스 원두 노트 리스트</title>
<meta name="description" content="카페 데니스에서 지금 내리는 필터 커피 원두를 확인하고, 마음에 드는 원두에 투표해 보세요." />
<meta name="theme-color" content="#121113" />
<meta property="og:type" content="website" />
<meta property="og:title" content="카페 데니스 원두 노트 리스트" />
<meta property="og:description" content="지금 판매 중인 원두 확인 · 마음에 드는 원두에 ♡ 투표 · 원두 요청까지" />
<meta property="og:url" content="https://dennisoh0714.github.io/beans-log/" />

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  :root{
    --black:#121113; --panel:#1b191a; --panel2:#232021; --border:#35302d;
    --ink:#f4f1ea; --sub:#a8a29a; --metal:#bcbfc3; --metalDark:#6f7276;
    --walnut:#6b4a32; --walnutLt:#9a6f4d; --amber:#cf954f; --danger:#c0524e;
    --green:#5fd17e; --greenBg:#1e3a24; --greenBd:#2f6b3f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--black);color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-text-size-adjust:100%;}
  .wrap{max-width:980px;margin:0 auto;padding:16px;}
  @media(min-width:640px){.wrap{padding:24px;}}
  button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  input,select,textarea{font-family:inherit;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;}
  [id^="sec-"]{scroll-margin-top:78px;}
  h2.sec{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;}
  .muted{color:var(--metalDark);font-size:11px;line-height:1.5;}
  .hidden{display:none!important;}
  /* 토스트 */
  #toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-90px);
    z-index:100;background:var(--walnut);color:var(--ink);border:1px solid var(--walnutLt);
    padding:11px 18px;border-radius:11px;font-size:13px;font-weight:700;
    box-shadow:0 6px 20px rgba(0,0,0,.5);transition:transform .25s;max-width:90vw;text-align:center;}
  #toast.show{transform:translateX(-50%) translateY(0);}
  /* 헤더 */
  header{background:linear-gradient(135deg,#232021,#161415);border:1px solid var(--border);
    border-radius:18px;padding:20px;margin-bottom:14px;}
  .hdrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .logo{background:var(--walnut);border-radius:12px;width:48px;height:48px;
    display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
  h1{font-size:21px;font-weight:800;letter-spacing:-.4px;}
  @media(min-width:640px){h1{font-size:24px;}}
  .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.22em;color:var(--amber);margin-bottom:4px;}
  .tagline{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.5;word-break:keep-all;}
  .langbtn{font-size:13px;font-weight:700;padding:8px 12px;border-radius:9px;
    background:var(--panel2);color:var(--sub);border:1px solid var(--border);
    display:flex;align-items:center;gap:5px;transition:background .12s,color .12s;}
  .langbtn.on{background:var(--walnut);color:var(--ink);border-color:var(--walnutLt);}
  .langflag{font-size:18px;line-height:1;}
  .lsglobe{font-size:16px;line-height:1;margin-right:2px;opacity:.85;}
  .langwrap{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center;}
  /* 모바일: 언어 버튼 4개를 한 줄에 균등 배치 */
  @media(max-width:560px){
    header{padding:16px;}
    .langwrap{width:100%;flex-wrap:nowrap;gap:5px;margin-top:2px;}
    .lsglobe{display:none;}
    .langbtn{flex:1;min-width:0;justify-content:center;padding:8px 2px;
      font-size:12px;letter-spacing:-.3px;gap:3px;}
    .langbtn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .langflag{font-size:14px;}
    .votehint{padding:12px 13px;gap:11px;}
    .votehint .vhicon{font-size:20px;}
    .votehint b{font-size:13.5px;}
    .votehint span{font-size:12px;}
  }
  /* 투표 방법 안내 배너 */
  .votehint{display:flex;align-items:center;gap:14px;
    background:linear-gradient(135deg,#2a2118,#1c1712);
    border:1px solid rgba(207,149,79,.35);border-radius:14px;
    padding:14px 16px;margin-bottom:16px;}
  .votehint .vhicon{font-size:26px;line-height:1;color:#ff8e8e;flex-shrink:0;
    animation:vhbeat 1.6s ease-in-out infinite;}
  .votehint b{display:block;font-size:14.5px;color:var(--amber);margin-bottom:3px;word-break:keep-all;}
  .votehint span{font-size:12.5px;color:var(--sub);line-height:1.55;word-break:keep-all;}
  @keyframes vhbeat{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
  @media(prefers-reduced-motion:reduce){.votehint .vhicon{animation:none;}}
  .votehint.slim{padding:9px 14px;gap:10px;}
  .votehint.slim .vhicon{font-size:16px;animation:none;}
  /* 원두 요청 유도 */
  .reqnudge{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    margin:4px 0 8px;font-size:13px;color:var(--metalDark);word-break:keep-all;}
  .reqnudgebtn{font-size:13px;font-weight:700;color:var(--amber);padding:8px 14px;border-radius:10px;
    background:rgba(207,149,79,.10);border:1px solid rgba(207,149,79,.35);}
  .reqnudgebtn:hover{background:rgba(207,149,79,.18);}
  /* 탭 */
  .tabbar{position:sticky;top:0;z-index:50;background:var(--black);
    padding:8px 0 12px;display:flex;gap:8px;}
  .tab{padding:10px 18px;border-radius:10px;font-size:14px;font-weight:700;
    background:var(--panel);color:var(--sub);border:1px solid var(--border);
    display:flex;align-items:center;gap:6px;}
  .tab.on{background:var(--walnut);color:var(--ink);border-color:var(--walnutLt);}
  .admgear{margin-left:auto;width:38px;height:38px;border-radius:10px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:16px;
    background:transparent;color:var(--metalDark);border:1px solid transparent;}
  .admgear:hover{color:var(--metal);background:var(--panel);border-color:var(--border);}
  .admgear.on{background:var(--walnut);color:var(--ink);border-color:var(--walnutLt);}
  /* 통계 */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px;}
  @media(min-width:880px){.stats{grid-template-columns:repeat(4,1fr);}}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .stat .lbl{color:var(--metalDark);font-size:12px;}
  .stat .val{font-size:22px;font-weight:800;margin-top:4px;word-break:keep-all;}
  .stat .sub{color:var(--sub);font-size:12px;margin-top:2px;}
  /* 판매중 섹션 */
  .nowsec{background:linear-gradient(135deg,var(--greenBg),#161d18);border:1px solid var(--greenBd);
    border-radius:14px;padding:16px;margin-bottom:16px;}
  .medal{font-size:20px;line-height:1;}
  /* 차트 */
  .barrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .barlabel{width:130px;font-size:11px;color:var(--sub);text-align:right;flex-shrink:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bartrack{flex:1;background:var(--panel2);border-radius:6px;height:18px;overflow:hidden;}
  .barfill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:6px;font-size:10px;font-weight:700;color:var(--black);min-width:24px;}
  /* 정렬/검색 */
  .sortbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .chip{font-size:12px;padding:7px 12px;border-radius:8px;font-weight:600;
    background:var(--panel2);color:var(--sub);border:1px solid var(--border);}
  .chip.on{background:var(--walnut);color:var(--ink);border-color:var(--walnutLt);}
  .chip.green{background:var(--greenBg);color:var(--green);border-color:var(--greenBd);}
  select.sel{font-size:12px;padding:7px 10px;border-radius:8px;background:var(--panel2);
    color:var(--ink);border:1px solid var(--border);outline:none;}
  .searchbox{flex:1;min-width:140px;display:flex;align-items:center;gap:6px;
    background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:0 10px;}
  .searchbox input{flex:1;background:none;border:none;outline:none;color:var(--ink);
    font-size:13px;padding:9px 0;}
  /* 더 보기 / 전체 보기 */
  .morebtn{width:100%;padding:13px;border-radius:10px;font-size:13px;font-weight:700;
    background:var(--panel2);color:var(--sub);border:1px dashed var(--border);margin-top:6px;}
  .morebtn.green{background:rgba(30,58,36,.4);color:var(--green);border-color:var(--greenBd);}
  /* 원두 카드 */
  .beans{display:grid;grid-template-columns:1fr;gap:14px;}
  .resultbar{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin:2px 2px 10px;font-size:12.5px;color:var(--metalDark);font-weight:600;}
  @media(min-width:640px){.beans{grid-template-columns:repeat(2,1fr);gap:16px;}}
  .bean{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;
    display:flex;flex-direction:column;gap:11px;box-shadow:0 3px 12px rgba(0,0,0,.28);
    transition:transform .15s,box-shadow .15s;}
  .bean:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.4);}
  .bean.dim{opacity:.55;}
  .brandrow{display:flex;align-items:center;gap:12px;}
  .blogo{width:80px;height:80px;border-radius:14px;object-fit:cover;flex-shrink:0;
    background:var(--panel2);border:1px solid var(--border);}
  .blogo.ph{display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--metalDark);}
  .bean .brand{font-size:13px;font-weight:700;color:var(--metal);letter-spacing:.3px;}
  .bean .bname{font-size:18px;font-weight:800;line-height:1.25;word-break:keep-all;}
  .procpill{font-size:11px;padding:4px 9px;border-radius:6px;background:var(--panel2);
    color:var(--metal);border:1px solid var(--border);white-space:nowrap;}
  .nowbadge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;
    padding:3px 8px;border-radius:999px;background:var(--greenBg);color:var(--green);
    border:1px solid var(--greenBd);letter-spacing:.3px;}
  .nowdot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;}
  .origin{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);}
  .notetags{display:flex;flex-wrap:wrap;gap:6px;}
  .ntag{font-size:11.5px;padding:4px 10px;border-radius:999px;font-weight:600;}
  .subnote{font-size:12.5px;color:var(--sub);line-height:1.55;}
  .beanfoot{display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--border);padding-top:10px;margin-top:2px;}
  .price{font-size:16px;font-weight:800;color:var(--amber);}
  .votebtn{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;
    font-size:14px;font-weight:800;background:var(--panel2);color:var(--sub);
    border:1px solid var(--border);transition:transform .08s;}
  .votebtn:active{transform:scale(.93);}
  .votebtn.voted{background:var(--walnut);color:#ff8e8e;border-color:var(--walnutLt);}
  @keyframes hpop{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
  .votebtn.voted .vheart{display:inline-block;animation:hpop .3s;}
  /* 지도 */
  .map{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  svg{display:block;width:100%;height:auto;}
  /* 폼 */
  label.fl{font-size:11px;color:var(--metalDark);display:block;margin-bottom:3px;}
  input.fi,select.fi,textarea.fi{width:100%;padding:9px 11px;border-radius:8px;font-size:13px;
    background:var(--panel2);color:var(--ink);border:1px solid var(--border);outline:none;}
  textarea.fi{resize:vertical;}
  .grid2{display:grid;grid-template-columns:1fr;gap:10px;}
  @media(min-width:640px){.grid2{grid-template-columns:repeat(2,1fr);}}
  .span2{grid-column:1/-1;}
  .btn{padding:9px 18px;border-radius:10px;font-size:13px;font-weight:800;
    background:var(--walnut);color:var(--ink);border:1px solid var(--walnutLt);}
  .btn.ghost{background:var(--panel2);color:var(--sub);border-color:var(--border);}
  .btn.amber{background:var(--amber);color:var(--black);border-color:var(--walnutLt);}
  .btn:disabled{opacity:.6;cursor:default;}
  .notebtn{font-size:11px;padding:6px 10px;border-radius:999px;font-weight:600;
    background:var(--panel2);color:var(--metalDark);border:1px solid var(--border);}
  /* 관리자 */
  .jumpbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .arow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;border-radius:9px;
    background:var(--panel2);border:1px solid var(--border);margin-bottom:8px;}
  .alogo{width:48px;height:48px;border-radius:9px;object-fit:cover;flex-shrink:0;
    background:var(--panel);border:1px solid var(--border);}
  .alogo.ph{display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--metalDark);}
  .icobtn{width:32px;height:32px;border-radius:8px;background:var(--panel);
    border:1px solid var(--border);color:var(--metal);font-size:14px;
    display:flex;align-items:center;justify-content:center;}
  .stepbtn{width:30px;height:30px;border-radius:7px;background:var(--panel);
    border:1px solid var(--border);color:var(--sub);font-size:15px;font-weight:800;}
  .saletoggle{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
    padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel);}
  .saletoggle.on{background:var(--greenBg);color:var(--green);border-color:var(--greenBd);}
  .saletoggle.off{color:var(--metalDark);}
  .swdot{width:28px;height:16px;border-radius:999px;background:var(--border);
    position:relative;transition:background .15s;flex-shrink:0;}
  .swdot.on{background:var(--greenBd);}
  .swdot::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;
    border-radius:50%;background:var(--ink);transition:left .15s;}
  .swdot.on::after{left:14px;}
  .err{color:var(--danger);font-size:11px;margin-top:6px;}
  .pre{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    padding:10px;font-size:11px;color:var(--metal);white-space:pre-wrap;
    font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.7;overflow-x:auto;}
  .fbwarn{background:#3a2a1a;border:1px solid var(--amber);border-radius:10px;
    padding:12px;margin-bottom:14px;font-size:12px;color:var(--amber);line-height:1.5;}
  /* 요청 */
  .reqcard{background:linear-gradient(135deg,#2a2320,#1a1718);border:1px solid var(--walnut);
    border-radius:14px;padding:16px;margin-bottom:16px;}
  .reqtop{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .reqtopitem{background:var(--panel2);border:1px solid var(--border);border-radius:999px;
    padding:6px 13px;font-size:12px;color:var(--ink);}
  .reqtopitem b{color:var(--amber);}
  .reqstat{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .reqstat .nm{width:90px;font-size:12px;color:var(--sub);flex-shrink:0;}
  .reqstat .tk{flex:1;background:var(--panel);border-radius:5px;height:16px;overflow:hidden;}
  .reqstat .fl2{height:100%;background:var(--walnutLt);border-radius:5px;display:block;}
  .reqstat .ct{font-size:11px;color:var(--amber);font-weight:700;width:36px;}
  .reqitem{padding:11px;border-radius:9px;background:var(--panel2);
    border:1px solid var(--border);margin-bottom:8px;font-size:12px;}
  .reqitem .meta{color:var(--metal);font-weight:700;}
  .reqitem .cmt{color:var(--sub);margin-top:4px;line-height:1.5;}
  .reqitem .dt{color:var(--metalDark);font-size:10px;margin-top:4px;}
  /* 로고 관리 */
  .logorow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:9px;
    background:var(--panel2);border:1px solid var(--border);margin-bottom:8px;flex-wrap:wrap;}
  /* 일괄 편집 */
  .bulkrow{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;
    padding:8px;border-radius:8px;background:var(--panel2);
    border:1px solid var(--border);margin-bottom:6px;align-items:center;}
  .bulkrow .konm{font-size:12px;color:var(--ink);font-weight:700;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bulkrow input{width:100%;padding:6px 9px;border-radius:6px;font-size:11px;
    background:var(--panel);color:var(--ink);border:1px solid var(--border);outline:none;}
  .bulkhead{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;
    padding:0 8px 4px;font-size:10px;color:var(--metalDark);font-weight:700;}
  @media(max-width:560px){
    .bulkrow{grid-template-columns:1fr;}
    .bulkhead{display:none;}
  }
  /* 맨 위로 */
  #topBtn{position:fixed;right:16px;bottom:16px;z-index:60;width:46px;height:46px;
    border-radius:50%;background:var(--walnut);color:var(--ink);font-size:20px;
    border:1px solid var(--walnutLt);box-shadow:0 4px 14px rgba(0,0,0,.5);
    display:none;align-items:center;justify-content:center;}
  #topBtn.show{display:flex;}
</style>

function autoTranslateNotes(ko){
  if(!ko)return "";
  var parts=String(ko).split(/([,，、·]\s*)/);
  var out=[],i;
  var keys=[];
  var kk;
  for(kk in FLAVOR_DICT){if(FLAVOR_DICT.hasOwnProperty(kk)){keys.push(kk);}}
  keys.sort(function(a,b){return b.length-a.length;});
  for(i=0;i<parts.length;i++){
    var seg=parts[i];
    if(/^[,，、·]/.test(seg)){out.push(seg);continue;}
    var w=seg.trim();
    if(!w){out.push(seg);continue;}
    if(FLAVOR_DICT[w]){out.push(FLAVOR_DICT[w]);continue;}
    var hit="";
    var j;
    for(j=0;j<keys.length;j++){
      if(w.indexOf(keys[j])>=0){hit=FLAVOR_DICT[keys[j]];break;}
    }
    out.push(hit||w);
  }
  return out.join("");
}

/* 첫 방문 시 브라우저 언어 자동 감지 (저장된 선택이 있으면 그것을 우선) */
function detectLang(){
  var saved=localStorage.getItem("cdn-lang");
  if(saved&&T[saved])return saved;
  var nav=((navigator.languages&&navigator.languages[0])||navigator.language||"ko").toLowerCase();
  if(nav.indexOf("ko")===0)return "ko";
  if(nav.indexOf("zh")===0)return "zh";
  if(nav.indexOf("th")===0)return "th";
  return "en";
}
var state={
  beans:null, brandLogos:{}, brandNamesEn:{}, requests:[],
  lang:detectLang(),
  myVotes:JSON.parse(localStorage.getItem("cdn-myvotes")||"[]"),
  tab:"dash", sortKey:"votes", countryFilter:"", processFilter:"", saleFilter:false, searchQ:"",
  nowExpand:false, listLimit:LIST_STEP, adminQ:"",
  authed:false, editId:null,
  form:{brand:"",name:"",nameEn:"",country:COUNTRIES[0].id,process:"Washed",notes:[],subnotes:"",subnotesEn:"",price:""},
  reqForm:{country:"",process:"",brand:"",comment:""},
  bulkEdits:{},
  patText:"", patMsg:"", fbReady:false
};
function t(k){return (T[state.lang]&&T[state.lang][k])||T.ko[k]||k;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmtPrice(n){return state.lang==="ko"?(n||0).toLocaleString()+"원":"₩"+(n||0).toLocaleString();}
function noteLabel(id,l){return NOTE_LABEL[id]?NOTE_LABEL[id][l]:id;}
function procLabel(id,l){return PROC_LABEL[id]?PROC_LABEL[id][l]:id;}
function countryName(id,l){return C_BY_ID[id]?C_BY_ID[id].names[l]:id;}
function beanName(b,l){return l==="ko"?(b.name||""):((b.nameEn&&b.nameEn.trim())?b.nameEn:(b.name||""));}
function brandName(brand,l){
  if(l==="ko")return brand;
  var en=state.brandNamesEn[brand];
  return (en&&en.trim())?en:brand;

function subnoteText(b,l){
  if(l==="ko")return b.subnotes||"";

function flash(msg){
  var el=document.getElementById("toast");
  if(!el)return;
  el.textContent=msg;

  clearTimeout(window._toastTm);
  window._toastTm=setTimeout(function(){el.classList.remove("show");},2200);
}

   Firebase
   ============================================================ */
var beansRef=null, logosRef=null, reqRef=null, brandEnRef=null;
function initFirebase(){
  var cfg=FIREBASE_CONFIG;
  if(typeof firebase==="undefined"){
    /* 미리보기 등 외부 스크립트가 차단된 환경 — 로컬 데이터로 동작 */
    console.warn("Firebase SDK 미로드: 로컬 데이터 모드로 실행합니다.");
    state.fbReady=false; loadLocal(); return;
  }
  if(!cfg.apiKey||cfg.apiKey.indexOf("여기에")===0||!cfg.databaseURL){
    state.fbReady=false; loadLocal(); return;
  }
  try{
    firebase.initializeApp(cfg);
    var root=firebase.database().ref("cafeDennis");
    beansRef=root.child("beans");
    logosRef=root.child("brandLogos");
    brandEnRef=root.child("brandNamesEn");
    reqRef=root.child("requests");
    state.fbReady=true;
    beansRef.on("value",function(snap){
      var v=snap.val();
      if(v&&Object.prototype.toString.call(v)==="[object Array]"){state.beans=v.filter(Boolean);}
      else if(v&&typeof v==="object"){
        var arr=[],k;
        for(k in v){if(v.hasOwnProperty(k)&&v[k])arr.push(v[k]);}
        state.beans=arr;
      }
      else{state.beans=SEED.slice();beansRef.set(SEED);}
      render();
    },function(err){console.error("FB beans:",err);state.fbReady=false;loadLocal();});
    logosRef.on("value",function(snap){state.brandLogos=snap.val()||{};render();},
      function(err){console.error("FB logos:",err);});
    brandEnRef.on("value",function(snap){state.brandNamesEn=snap.val()||{};render();},
      function(err){console.error("FB brandEn:",err);});
    reqRef.on("value",function(snap){
      var v=snap.val();
      if(v&&Object.prototype.toString.call(v)==="[object Array]"){state.requests=v.filter(Boolean);}
      else if(v&&typeof v==="object"){
        var arr=[],k;
        for(k in v){if(v.hasOwnProperty(k)&&v[k])arr.push(v[k]);}
        state.requests=arr;
      }
      else{state.requests=[];}
      render();
    },function(err){console.error("FB requests:",err);});
  }catch(e){console.error(e);state.fbReady=false;loadLocal();}
}
function loadLocal(){
  var ls=localStorage.getItem("cdn-beans");
  state.beans=ls?JSON.parse(ls):SEED.slice();
  state.brandLogos=JSON.parse(localStorage.getItem("cdn-logos")||"{}");
  state.brandNamesEn=JSON.parse(localStorage.getItem("cdn-branden")||"{}");
  state.requests=JSON.parse(localStorage.getItem("cdn-requests")||"[]");
  render();
}
function saveBeans(next){
  var clean=(next||[]).filter(Boolean).slice();
  state.beans=clean;
  if(state.fbReady&&beansRef){
    beansRef.set(clean).then(function(){render();}).catch(function(e){console.error(e);render();});
  }else{
    localStorage.setItem("cdn-beans",JSON.stringify(clean));render();
  }
}
function saveLogos(next){
  state.brandLogos=next;
  if(state.fbReady&&logosRef){logosRef.set(next).catch(function(e){console.error(e);});}
  else{localStorage.setItem("cdn-logos",JSON.stringify(next));render();}
}
function saveBrandEn(next){
  state.brandNamesEn=next;
  if(state.fbReady&&brandEnRef){brandEnRef.set(next).catch(function(e){console.error(e);});}
  else{localStorage.setItem("cdn-branden",JSON.stringify(next));render();}
}
function saveRequests(next){
  var clean=(next||[]).filter(Boolean).slice();
  state.requests=clean;
  if(state.fbReady&&reqRef){
    reqRef.set(clean).then(function(){render();}).catch(function(e){console.error(e);render();});
  }else{
    localStorage.setItem("cdn-requests",JSON.stringify(clean));render();
  }
}

function mapCountry(s){
  var k=(s||"").trim().toLowerCase();
  if(COUNTRY_ALIAS[k])return COUNTRY_ALIAS[k];
  var key;
  for(key in COUNTRY_ALIAS){
    if(COUNTRY_ALIAS.hasOwnProperty(key)&&k.indexOf(key)>=0)return COUNTRY_ALIAS[key];
  }
  return COUNTRIES[0].id;
}
function mapProcess(s){
  var k=(s||"").trim().toLowerCase().replace(/[\s()]/g,"");
  if(PROC_ALIAS[k])return PROC_ALIAS[k];
  var key;
  for(key in PROC_ALIAS){
    if(PROC_ALIAS.hasOwnProperty(key)&&k.indexOf(key)>=0)return PROC_ALIAS[key];
  }
  return "Other";
}
function mapNotes(s){
  var out=[];
  var parts=(s||"").split(/[,，、·]/);
  var i,key;
  for(i=0;i<parts.length;i++){
    var k=parts[i].trim().toLowerCase();
    if(!k)continue;
    if(NOTE_ALIAS[k]){if(out.indexOf(NOTE_ALIAS[k])<0)out.push(NOTE_ALIAS[k]);continue;}
    for(key in NOTE_ALIAS){
      if(NOTE_ALIAS.hasOwnProperty(key)&&k.indexOf(key)>=0){
        if(out.indexOf(NOTE_ALIAS[key])<0)out.push(NOTE_ALIAS[key]);
        break;
      }
    }
  }
  return out.slice(0,3);
}
function splitKoEn(s){
  var idx=(s||"").indexOf("/");
  if(idx<0)return [(s||"").trim(),""];
  return [s.slice(0,idx).trim(),s.slice(idx+1).trim()];
}
function parsePattern(text){
  var beans=[];
  var lines=text.split(/\r?\n/);
  var i;
  for(i=0;i<lines.length;i++){
    var ln=lines[i].trim();
    if(!ln)continue;
    var f=ln.split("|");
    var j;
    for(j=0;j<f.length;j++){f[j]=f[j].trim();}
    if(f.length<2||!f[0]||!f[1])continue;
    var nm=splitKoEn(f[1]);
    var sub=splitKoEn(f[5]||"");
    beans.push({
      id:"b_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
      brand:f[0], name:nm[0], nameEn:nm[1],
      country:mapCountry(f[2]||""),
      process:mapProcess(f[3]||""),
      notes:mapNotes(f[4]||""),
      subnotes:sub[0], subnotesEn:sub[1],
      price:Number((f[6]||"").replace(/[^\d]/g,""))||0,
      votes:0, onSale:true
    });
  }
  return beans;
}
function compressLogo(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var SZ=160;
      var cv=document.createElement("canvas");
      cv.width=SZ;cv.height=SZ;
      var ctx=cv.getContext("2d");
      var side=Math.min(img.width,img.height);
      var sx=(img.width-side)/2, sy=(img.height-side)/2;
      ctx.clearRect(0,0,SZ,SZ);
      ctx.drawImage(img,sx,sy,side,side,0,0,SZ,SZ);
      cb(cv.toDataURL("image/png"));
    };
    img.onerror=function(){cb(null);};
    img.src=fr.result;
  };
  fr.onerror=function(){cb(null);};
  fr.readAsDataURL(file);
}

function mapSVG(cstats,filter){
  var beltTop=(90-23.5)*2,beltBot=(90+23.5)*2;
  var s='<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">';
  s+='<defs><linearGradient id="wal" x1="0" y1="0" x2="0" y2="1">'+

  s+='<rect width="720" height="360" fill="url(#mbg)"/>';
  var xs=[60,120,180,240,300,360,420,480,540,600,660],i;
  for(i=0;i<xs.length;i++){s+='<line x1="'+xs[i]+'" y1="0" x2="'+xs[i]+'" y2="360" stroke="#35302d" stroke-width="0.5" opacity="0.5"/>';}

  s+='<rect x="0" y="'+beltTop+'" width="720" height="'+(beltBot-beltTop)+'" fill="#cf954f" opacity="0.07"/>';
  s+='<line x1="0" y1="'+beltTop+'" x2="720" y2="'+beltTop+'" stroke="#cf954f" stroke-width="0.7" stroke-dasharray="4 4" opacity="0.5"/>';
  s+='<line x1="0" y1="'+beltBot+'" x2="720" y2="'+beltBot+'" stroke="#cf954f" stroke-width="0.7" stroke-dasharray="4 4" opacity="0.5"/>';

  var key;
  for(key in CONT){
    if(CONT.hasOwnProperty(key)){
      var pts="",p=CONT[key],j;

      s+='<polygon points="'+pts+'" fill="#6f7276" opacity="0.22" stroke="#bcbfc3" stroke-width="0.6" stroke-opacity="0.4"/>';
    }
  }
  for(i=0;i<cstats.length;i++){

}

  var sorted=beans.slice().sort(function(a,b){return (b.votes||0)-(a.votes||0);});
  var top=sorted[0];
  var onSaleCnt=0;
  for(i=0;i<beans.length;i++){if(isOnSale(beans[i]))onSaleCnt++;}

      '<div><b>'+esc(t("voteHintTitle"))+'</b>'+
      '<span>'+esc(t("voteHintDesc"))+'</span></div></div>';

  h+='<div class="stats">'+
    statCard("&#9749;",t("statBeans"),beans.length+t("unitKind"),"")+
    statCard("&#9679;",t("statOnSale"),onSaleCnt+t("unitKind"),"")+
    statCard("&#9829;",t("statVotes"),totalVotes,"")+
    statCard("&#127942;",t("statTop"),topVal,top?esc(brandName(top.brand,l))+" &#183; &#9829;"+(top.votes||0):"")+
    '</div>';

  /* 판매중 섹션 (인기순 + TOP3 메달 + 접기) */
  var onSaleBeans=[];
  for(i=0;i<beans.length;i++){if(isOnSale(beans[i]))onSaleBeans.push(beans[i]);}
  onSaleBeans.sort(function(a,b){return (b.votes||0)-(a.votes||0);});
  h+='<div class="nowsec">'+
     '<h2 class="sec" style="margin-bottom:10px;color:#5fd17e">&#9749; '+esc(t("nowTitle"))+
     ' <span style="color:#3f8a52;font-weight:600">('+onSaleBeans.length+t("unitKind")+')</span></h2>';
  if(!onSaleBeans.length){
    h+='<p class="muted">'+esc(t("nowEmpty"))+'</p>';
  }else{
    var showList=state.nowExpand?onSaleBeans:onSaleBeans.slice(0,NOW_PREVIEW);
    h+='<div class="beans">';
    var medals=["&#129351;","&#129352;","&#129353;"];
    for(i=0;i<showList.length;i++){
      h+=beanCardHtml(showList[i],l,i<3?medals[i]:"");
    }
    h+='</div>';
    if(onSaleBeans.length>NOW_PREVIEW){
      h+='<button class="morebtn green" onclick="window.toggleNowExpand()">'+
         (state.nowExpand?("&#9650; "+esc(t("nowLess"))):("&#9660; "+esc(t("nowMore"))+" ("+onSaleBeans.length+t("unitKind")+")"))+
         '</button>';
    }
  }
  h+='</div>';

  /* 랭킹 차트 */
  var cd=sorted.slice(0,8);
  var max=1;
  for(i=0;i<cd.length;i++){if((cd[i].votes||0)>max)max=cd[i].votes;}
  h+='<div class="card" style="padding:16px;margin-bottom:16px">'+
     '<h2 class="sec" style="margin-bottom:12px">&#128200; '+esc(t("rankTitle"))+'</h2>';
  for(i=0;i<cd.length;i++){
    var w=Math.round((cd[i].votes||0)/max*100);
    h+='<div class="barrow"><div class="barlabel">'+esc(beanName(cd[i],l))+'</div>'+
       '<div class="bartrack"><div class="barfill" style="width:'+Math.max(w,4)+'%;background:'+(i===0?"#cf954f":"#9a6f4d")+'">'+(cd[i].votes||0)+'</div></div></div>';
  }
  h+='</div>';

  /* 지도 */
  var cm={};
  for(i=0;i<beans.length;i++){
    var b=beans[i];
    var c=C_BY_ID[b.country];
    if(!c)continue;
    if(!cm[b.country])cm[b.country]={id:b.country,name:c.names[l],lat:c.lat,lon:c.lon,votes:0,count:0};
    cm[b.country].votes+=(b.votes||0);cm[b.country].count++;
  }
  var cstats=[],k;
  for(k in cm){if(cm.hasOwnProperty(k))cstats.push(cm[k]);}
  h+='<div class="card" style="padding:16px;margin-bottom:16px">'+
     '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px">'+
     '<h2 class="sec">&#127757; '+esc(t("mapTitle"))+'</h2>'+
     (state.countryFilter?'<button class="chip on" onclick="window.pickCountry(\''+state.countryFilter+'\')">&#10005; '+esc(countryName(state.countryFilter,l))+' &#183; '+esc(t("mapClear"))+'</button>':"")+
     '</div><div class="map">'+mapSVG(cstats,state.countryFilter)+'</div>'+
     '<p class="muted" style="margin-top:8px">'+esc(t("mapHint"))+'</p></div>';

  /* 검색 + 정렬 */
  var sorts=[["votes","sVotes"],["brand","sBrand"],["country","sCountry"],["process","sProcess"],["price","sPrice"]];
  h+='<div class="card" style="padding:14px;margin-bottom:14px"><div class="sortbar">'+
     '<div class="searchbox">&#128269;<input class="dashsearch" value="'+esc(state.searchQ)+'" placeholder="'+esc(t("searchPh"))+'" aria-label="'+esc(t("searchPh"))+'" oninput="window.setSearch(this.value)"/></div>'+
     '</div><div class="sortbar" style="margin-top:8px">'+
     '<span style="font-size:12px;font-weight:700;color:#6f7276;margin-right:2px">'+esc(t("filterLabel"))+'</span>';
  for(i=0;i<sorts.length;i++){
    h+='<button class="chip'+(state.sortKey===sorts[i][0]?" on":"")+'" onclick="window.setSort(\''+sorts[i][0]+'\')">'+esc(t(sorts[i][1]))+'</button>';
  }
  h+='<button class="chip'+(state.saleFilter?" green":"")+'" onclick="window.toggleSaleFilter()">&#9679; '+esc(t("nowFilter"))+'</button>'+
     '<select class="sel" style="margin-left:auto" onchange="window.setProcFilter(this.value)">'+
     '<option value="">'+esc(t("procAll"))+'</option>';
  for(i=0;i<PROCESSES.length;i++){
    h+='<option value="'+PROCESSES[i]+'"'+(state.processFilter===PROCESSES[i]?" selected":"")+'>'+esc(procLabel(PROCESSES[i],l))+'</option>';
  }
  h+='</select></div></div>';

  /* 전체 목록 (더 보기) */
  var view=[];
  var q=state.searchQ.toLowerCase();
  for(i=0;i<beans.length;i++){
    var bb=beans[i];
    if(state.countryFilter&&bb.country!==state.countryFilter)continue;
    if(state.processFilter&&bb.process!==state.processFilter)continue;
    if(state.saleFilter&&!isOnSale(bb))continue;
    if(q){
      /* 이름·브랜드 + 생산지·가공법·향미·세부 노트까지 검색 (표시 언어 + 한/영) */
      var hp=[bb.name,bb.nameEn||"",bb.brand,state.brandNamesEn[bb.brand]||"",
        countryName(bb.country,l),countryName(bb.country,"ko"),countryName(bb.country,"en"),
        procLabel(bb.process,l),procLabel(bb.process,"ko"),procLabel(bb.process,"en"),
        subnoteText(bb,l)||"",bb.subnotes||"",bb.subnotesEn||""];
      var ni,nn=bb.notes||[];
      for(ni=0;ni<nn.length;ni++){hp.push(noteLabel(nn[ni],l),noteLabel(nn[ni],"ko"),noteLabel(nn[ni],"en"));}
      if(hp.join(" ").toLowerCase().indexOf(q)<0)continue;
    }
    view.push(bb);
  }
  var cmps={
    votes:function(a,b){return (b.votes||0)-(a.votes||0);},
    brand:function(a,b){return a.brand.localeCompare(b.brand,"ko");},
    country:function(a,b){return countryName(a.country,l).localeCompare(countryName(b.country,l));},
    process:function(a,b){return procLabel(a.process,l).localeCompare(procLabel(b.process,l));},
    price:function(a,b){return (a.price||0)-(b.price||0);}
  };
  view.sort(cmps[state.sortKey]||cmps.votes);

  /* 결과 개수 + 검색·필터 지우기 */
  var hasFilter=!!(q||state.countryFilter||state.processFilter||state.saleFilter);
  h+='<div class="resultbar"><span>'+esc(t("resultCount").replace("{n}",view.length))+'</span>'+
     (hasFilter?'<button class="chip" onclick="window.clearFilters()">&#10005; '+esc(t("clearFilters"))+'</button>':"")+
     '</div>';

  var shown=view.slice(0,state.listLimit);
  h+='<div class="beans" style="padding-bottom:8px">';
  if(!view.length)h+='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#6f7276;font-size:13px">'+esc(t("noBeans"))+'</div>';
  for(i=0;i<shown.length;i++){h+=beanCardHtml(shown[i],l,"");}
  h+='</div>';
  if(view.length>state.listLimit){
    h+='<button class="morebtn" onclick="window.moreList()">&#9660; '+esc(t("btnMore"))+' (+'+(view.length-state.listLimit)+')</button>';
  }
  /* 원두 요청 유도 */
  h+='<div class="reqnudge">'+esc(t("reqNudgeQ"))+
     '<button class="reqnudgebtn" onclick="window.setTab(\'req\')">&#9749; '+esc(t("reqNudgeBtn"))+'</button></div>';

  h+='<div style="height:32px"></div>';
  return h;
}

    h+='<option value="'+PROCESSES[i]+'"'+(rf.process===PROCESSES[i]?" selected":"")+'>'+esc(procLabel(PROCESSES[i],l))+'</option>';
  }
  h+='</select></div>'+
     '<div><label class="fl">'+esc(t("reqBrand"))+'</label>'+
     '<input class="fi" value="'+esc(rf.brand)+'" placeholder="'+esc(t("reqBrandPh"))+'" maxlength="40" oninput="window.rForm(\'brand\',this.value)"/></div>'+
     '<div><label class="fl">'+esc(t("reqComment"))+'</label>'+

     '</div>'+
     '<button class="btn amber" style="margin-top:14px" onclick="window.submitRequest()">&#9993; '+esc(t("reqSubmit"))+'</button>'+

       '<div style="display:flex;align-items:center;gap:4px">'+

     '<div><label class="fl">'+esc(t("fName"))+'</label><input class="fi" value="'+esc(f.name)+'" oninput="window.fForm(\'name\',this.value)"/></div>'+
     '<div class="span2"><label class="fl">'+esc(t("fNameEn"))+'</label><input class="fi" value="'+esc(f.nameEn||"")+'" placeholder="'+esc(t("fNameEnPh"))+'" oninput="window.fForm(\'nameEn\',this.value)"/></div>'+
     '<div><label class="fl">'+esc(t("fCountry"))+'</label><select class="fi" onchange="window.fForm(\'country\',this.value)">';
  for(i=0;i<COUNTRIES.length;i++){
    h+='<option value="'+COUNTRIES[i].id+'"'+(f.country===COUNTRIES[i].id?" selected":"")+'>'+esc(COUNTRIES[i].names[l])+'</option>';
  }
  h+='</select></div>'+
     '<div><label class="fl">'+esc(t("fProcess"))+'</label><select class="fi" onchange="window.fForm(\'process\',this.value)">';
  for(i=0;i<PROCESSES.length;i++){
    h+='<option value="'+PROCESSES[i]+'"'+(f.process===PROCESSES[i]?" selected":"")+'>'+esc(procLabel(PROCESSES[i],l))+'</option>';

  h+='</select></div>'+

  for(i=0;i<SCAA.length;i++){
    var n=SCAA[i];
    var on=f.notes.indexOf(n)>=0;
    h+='<button class="notebtn" style="'+(on?"background:"+NOTE_COLOR[n]+"33;color:"+NOTE_COLOR[n]+";border-color:"+NOTE_COLOR[n]+"77":"")+'" onclick="window.toggleNote(\''+n+'\')">'+esc(noteLabel(n,l))+'</button>';
  }
  h+='</div></div>'+
     '<div class="span2"><label class="fl">'+esc(t("fSubnotes"))+'</label><input class="fi" value="'+esc(f.subnotes)+'" placeholder="'+esc(t("fSubPh"))+'" oninput="window.fForm(\'subnotes\',this.value)"/></div>'+

  /* ③ 패턴 입력 */
  h+='<div class="card" id="sec-pat" style="padding:16px;margin-bottom:16px;background:linear-gradient(135deg,#252021,#1a1718);border-color:#6b4a32">'+
     '<h2 class="sec" style="margin-bottom:4px">&#9776; '+esc(t("patTitle"))+'</h2>'+
     '<p class="muted" style="margin-bottom:8px;white-space:pre-wrap">'+esc(t("patDesc"))+'</p>'+
     '<div class="pre" style="margin-bottom:8px">브랜드 | 원두명 | 생산지 | 가공법 | 노트 | 세부노트 | 금액\n모모스커피 | 예가체프 코체레 / Yirgacheffe Kochere | 에티오피아 | 워시드 | 꽃향,과일향 | 자스민,레몬 / jasmine,lemon | 28000</div>'+
     '<textarea class="fi" rows="4" placeholder="모모스커피 | 예가체프 코체레 / Yirgacheffe Kochere | 에티오피아 | 워시드 | 꽃향,과일향 | 자스민,레몬 | 28000" oninput="window.setPatText(this.value)">'+esc(state.patText)+'</textarea>'+
     (state.patMsg?'<div class="err" style="color:#cf954f">'+esc(state.patMsg)+'</div>':"")+
     '<button class="btn amber" style="margin-top:10px" onclick="window.runPattern()">&#9776; '+esc(t("patBtn"))+'</button>'+
     '</div>';

  /* ④ 원두 요청 관리 */

  h+='<div class="card" id="sec-req" style="padding:16px;margin-bottom:16px">'+
     '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">'+
     '<h2 class="sec">&#9993; '+esc(t("reqAdminTitle"))+' ('+reqs.length+esc(t("reqCount"))+')</h2>'+

     '</div>';

    rce.sort(function(a,b){return b[1]-a[1];});
    rpe.sort(function(a,b){return b[1]-a[1];});
    var rcmax=1,rpmax=1;
    for(i=0;i<rce.length;i++){if(rce[i][1]>rcmax)rcmax=rce[i][1];}
    for(i=0;i<rpe.length;i++){if(rpe[i][1]>rpmax)rpmax=rpe[i][1];}
    h+='<div class="grid2" style="margin-bottom:12px">';
    h+='<div><div style="font-size:12px;font-weight:700;color:#6f7276;margin-bottom:6px">&#127757; '+esc(t("reqByCountry"))+'</div>';
    for(i=0;i<rce.length;i++){
      h+='<div class="reqstat"><span class="nm">'+esc(countryName(rce[i][0],l))+'</span>'+
         '<span class="tk"><span class="fl2" style="width:'+Math.round(rce[i][1]/rcmax*100)+'%"></span></span>'+
         '<span class="ct">'+rce[i][1]+'</span></div>';
    }
    h+='</div><div><div style="font-size:12px;font-weight:700;color:#6f7276;margin-bottom:6px">&#129514; '+esc(t("reqByProcess"))+'</div>';
    if(!rpe.length)h+='<p class="muted">&#8212;</p>';
    for(i=0;i<rpe.length;i++){
      h+='<div class="reqstat"><span class="nm">'+esc(procLabel(rpe[i][0],l))+'</span>'+
         '<span class="tk"><span class="fl2" style="width:'+Math.round(rpe[i][1]/rpmax*100)+'%"></span></span>'+
         '<span class="ct">'+rpe[i][1]+'</span></div>';
    }
    h+='</div></div>';
    h+='<div style="font-size:12px;font-weight:700;color:#6f7276;margin:10px 0 6px">'+esc(t("reqListTitle"))+'</div>';
    for(i=0;i<reqs.length;i++){
      var rq=reqs[i];
      var parts=[countryName(rq.country,l)];
      if(rq.process)parts.push(procLabel(rq.process,l));
      if(rq.brand)parts.push(rq.brand);
      var dt=rq.ts?new Date(rq.ts).toLocaleString():"";
      h+='<div class="reqitem">'+
         '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">'+
         '<span class="meta">&#127757; '+esc(parts.join(" &#183; "))+'</span>'+
         '<button class="icobtn" style="width:26px;height:26px;color:#c0524e" onclick="window.delRequest(\''+rq.id+'\')">&#128465;</button>'+
         '</div>'+
         (rq.comment?'<div class="cmt">&#8220;'+esc(rq.comment)+'&#8221;</div>':"")+
         (dt?'<div class="dt">'+esc(dt)+'</div>':"")+
         '</div>';
    }
  }
  h+='</div>';

  /* ⑤ 영어 일괄 수정 */
  h+='<div class="card" id="sec-bulk" style="padding:16px;margin-bottom:16px">'+
     '<h2 class="sec" style="margin-bottom:4px">&#127760; '+esc(t("bulkTitle"))+'</h2>'+
     '<p class="muted" style="margin-bottom:10px">'+esc(t("bulkDesc"))+'</p>'+
     '<div style="background:#2a2320;border:1px solid #6b4a32;border-radius:9px;padding:10px;margin-bottom:12px">'+
     '<button class="btn amber" onclick="window.bulkAutoNotes()">&#10024; '+esc(t("bulkAutoBtn"))+'</button>'+
     '<p class="muted" style="margin-top:6px">'+esc(t("bulkAutoHint"))+'</p></div>';
  if(state.beans.length){
    h+='<p class="muted" style="margin-bottom:6px">'+esc(t("bulkTableHint"))+'</p>'+
       '<div class="bulkhead"><span>'+esc(t("bulkColName"))+'</span><span>'+esc(t("bulkColNameEn"))+'</span><span>'+esc(t("bulkColSubEn"))+'</span></div>';
    for(i=0;i<state.beans.length;i++){
      var bk=state.beans[i];
      h+='<div class="bulkrow">'+
         '<div class="konm" title="'+esc(bk.name)+'">'+esc(bk.name)+'</div>'+
         '<input value="'+esc(bk.nameEn||"")+'" placeholder="'+esc(t("fNameEnPh"))+'" oninput="window.bulkField(\''+bk.id+'\',\'nameEn\',this.value)"/>'+
         '<input value="'+esc(bk.subnotesEn||"")+'" placeholder="'+esc(autoTranslateNotes(bk.subnotes||""))+'" oninput="window.bulkField(\''+bk.id+'\',\'subnotesEn\',this.value)"/>'+
         '</div>';
    }
    h+='<button class="btn" style="margin-top:10px" onclick="window.bulkSaveAll()">&#128190; '+esc(t("bulkSaveAll"))+'</button>';
  }
  h+='</div>';

  /* ⑥ 로고·브랜드 영어명 */
  var brands=[];
  for(i=0;i<state.beans.length;i++){
    var br=state.beans[i].brand;
    if(br&&brands.indexOf(br)<0)brands.push(br);
  }
  brands.sort(function(a,b){return a.localeCompare(b,"ko");});
  h+='<div class="card" id="sec-logo" style="padding:16px;margin-bottom:16px">'+
     '<h2 class="sec" style="margin-bottom:4px">&#127991; '+esc(t("logoTitle"))+'</h2>'+
     '<p class="muted" style="margin-bottom:12px">'+esc(t("logoDesc"))+'</p>';
  if(!brands.length){
    h+='<p class="muted">'+esc(t("logoNoBrands"))+'</p>';
  }else{
    for(i=0;i<brands.length;i++){
      var brd=brands[i];
      var blogo=state.brandLogos[brd];
      var enVal=state.brandNamesEn[brd]||"";
      var inputId="logoFile_"+i;
      var brdEsc=esc(brd).replace(/'/g,"\\'");
      var cnt=0,j;
      for(j=0;j<state.beans.length;j++){if(state.beans[j].brand===brd)cnt++;}
      h+='<div class="logorow">'+
         (blogo?'<img class="alogo" src="'+blogo+'" alt="'+esc(brd)+'"/>':'<div class="alogo ph">&#9749;</div>')+
         '<div style="flex:1;min-width:140px">'+
         '<div style="font-size:13px;font-weight:700;margin-bottom:4px">'+esc(brd)+
         ' <span class="muted">('+cnt+esc(t("unitKind"))+')</span></div>'+
         '<input value="'+esc(enVal)+'" placeholder="'+esc(t("brandEnPh"))+'" '+
         'style="width:100%;padding:6px 9px;border-radius:6px;font-size:11px;background:var(--panel);color:var(--ink);border:1px solid var(--border);outline:none" '+
         'onchange="window.saveBrandEnName(\''+brdEsc+'\',this.value)"/></div>'+
         '<input type="file" id="'+inputId+'" accept="image/png" class="hidden" onchange="window.uploadLogo(\''+brdEsc+'\',event)"/>'+
         '<button class="btn ghost" onclick="document.getElementById(\''+inputId+'\').click()">&#11014; '+esc(blogo?t("logoChange"):t("logoUpload"))+'</button>'+
         (blogo?'<button class="icobtn" style="color:#c0524e" onclick="window.removeLogo(\''+brdEsc+'\')">&#128465;</button>':"")+
         '</div>';
    }
  }
  h+='</div>';

  /* ⑦ 백업 */
  h+='<div class="card" id="sec-backup" style="padding:16px;margin-bottom:16px">'+
     '<h2 class="sec" style="margin-bottom:4px">&#128190; '+esc(t("backupTitle"))+'</h2>'+
     '<p class="muted" style="margin-bottom:12px">'+esc(t("backupDesc"))+'</p>'+
     '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
     '<button class="btn ghost" onclick="window.exportJSON()">&#11015; '+esc(t("btnExport"))+'</button>'+
     '<button class="btn ghost" onclick="document.getElementById(\'impFile\').click()">&#11014; '+esc(t("btnImport"))+'</button>'+
     '<input type="file" id="impFile" accept=".json,application/json" class="hidden" onchange="window.importJSON(event)"/>'+
     '</div></div>';

  return h;
}

/* ============================================================
   메인 렌더
   ============================================================ */
function safeRender(fn){
  try{return fn();}
  catch(e){
    console.error("render error:",e);
    return '<div class="card" style="padding:16px;color:#c0524e;font-size:12px">Render error: '+esc(String(e))+'</div>';
  }
}
function render(){
  var app=document.getElementById("app");
  var l=state.lang;
  document.documentElement.lang=l;
  document.title=t("appTitle");
  if(!state.beans){
    app.innerHTML='<div style="text-align:center;padding:80px;color:#a8a29a">'+esc(t("loading"))+'</div>';
    return;
  }
  var h="";
  h+='<header><div class="hdrow">'+
     '<div style="display:flex;align-items:center;gap:12px">'+
     '<div class="logo">&#9749;</div>'+
     '<div><div class="eyebrow">CAFE DENNIS &#183; BEAN CURATION</div>'+
     '<h1>'+esc(t("appTitle"))+'</h1>'+
     '<p class="tagline">'+esc(t("appTagline"))+'</p></div></div>'+
     '<div class="langwrap">'+
     '<span class="lsglobe" aria-hidden="true">&#127760;</span>';
  var i;
  for(i=0;i<LANGS.length;i++){
    var lg=LANGS[i];
    h+='<button class="langbtn'+(lg.id===l?" on":"")+'" aria-pressed="'+(lg.id===l?"true":"false")+'" onclick="window.setLang(\''+lg.id+'\')" title="'+lg.label+'">'+
       '<span class="langflag" aria-hidden="true">'+lg.flag+'</span><span>'+lg.label+'</span></button>';
  }
  h+='</div></div></header>';

  h+='<div class="tabbar">'+
     '<button class="tab'+(state.tab==="dash"?" on":"")+'"'+(state.tab==="dash"?' aria-current="true"':'')+' onclick="window.setTab(\'dash\')">&#128200; '+esc(t("tabDash"))+'</button>'+
     '<button class="tab'+(state.tab==="req"?" on":"")+'"'+(state.tab==="req"?' aria-current="true"':'')+' onclick="window.setTab(\'req\')">&#9749; '+esc(t("tabReq"))+'</button>'+
     '<button class="admgear'+(state.tab==="admin"?" on":"")+'"'+(state.tab==="admin"?' aria-current="true"':'')+' onclick="window.setTab(\'admin\')" title="'+esc(t("tabAdmin"))+'" aria-label="'+esc(t("tabAdmin"))+'">&#9881;</button>'+
     '</div>';

  if(state.tab==="dash")h+=safeRender(renderDash);
  else if(state.tab==="req")h+=safeRender(renderRequestTab);
  else h+=safeRender(renderAdmin);

  app.innerHTML=h;
}

/* ============================================================
   이벤트 핸들러
   ============================================================ */
window.setLang=function(v){state.lang=v;localStorage.setItem("cdn-lang",v);render();};
window.setTab=function(v){state.tab=v;render();window.scrollTo({top:0});};
window.setSort=function(v){state.sortKey=v;state.listLimit=LIST_STEP;render();};
window.setProcFilter=function(v){state.processFilter=v;state.listLimit=LIST_STEP;render();};
window.toggleSaleFilter=function(){state.saleFilter=!state.saleFilter;state.listLimit=LIST_STEP;render();};
window.pickCountry=function(id){state.countryFilter=state.countryFilter===id?"":id;state.listLimit=LIST_STEP;render();};
window.toggleNowExpand=function(){state.nowExpand=!state.nowExpand;render();};
window.moreList=function(){state.listLimit+=LIST_STEP;render();};
window.jumpTo=function(id){
  var el=document.getElementById(id);
  if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
};
window.clearFilters=function(){
  state.searchQ="";state.countryFilter="";state.processFilter="";state.saleFilter=false;
  state.listLimit=LIST_STEP;render();
};
window.setSearch=function(v){
  state.searchQ=v;
  state.listLimit=LIST_STEP;
  clearTimeout(window._searchTm);

    render();
    var el=document.querySelector(".dashsearch");
    if(el){el.focus();var p=el.value.length;try{el.setSelectionRange(p,p);}catch(e){}}
  },250);
};
window.setAdminQ=function(v){
  state.adminQ=v;
  clearTimeout(window._aqTm);
  window._aqTm=setTimeout(function(){
    render();
    var el=document.querySelector(".adminsearch");
    if(el){el.focus();var p=el.value.length;try{el.setSelectionRange(p,p);}catch(e){}}
  },250);
};
window.vote=function(id){
  var voted=state.myVotes.indexOf(id)>=0;
  var delta=voted?-1:1;
  var next=[],i;
  for(i=0;i<state.beans.length;i++){
    var b=state.beans[i];
    if(b.id===id){
      var nb={};var k;for(k in b){if(b.hasOwnProperty(k))nb[k]=b[k];}
      nb.votes=Math.max(0,(b.votes||0)+delta);
      next.push(nb);
    }else next.push(b);
  }
  state.beans=next;
  if(state.fbReady&&beansRef){beansRef.set(next).catch(function(e){console.error(e);});}
  else{localStorage.setItem("cdn-beans",JSON.stringify(next));}
  if(voted){state.myVotes.splice(state.myVotes.indexOf(id),1);}
  else{state.myVotes.push(id);}
  localStorage.setItem("cdn-myvotes",JSON.stringify(state.myVotes));
  flash(t(voted?"voteUndo":"voteThanks"));
  render();
};
window.tryAuth=function(){
  var el=document.getElementById("pwInput");
  if(el&&el.value===ADMIN_PW){state.authed=true;render();}
  else{var e=document.getElementById("pwErr");if(e)e.classList.remove("hidden");}
};
window.fForm=function(k,v){state.form[k]=v;};
window.toggleNote=function(n){
  var idx=state.form.notes.indexOf(n);
  if(idx>=0)state.form.notes.splice(idx,1);
  else state.form.notes.push(n);
  render();
};
function blankForm(){
  return {brand:"",name:"",nameEn:"",country:COUNTRIES[0].id,process:"Washed",notes:[],subnotes:"",subnotesEn:"",price:""};
}
window.saveForm=function(){
  var f=state.form;
  if(!f.brand.trim()||!f.name.trim()){flash(t("msgNeedName"));return;}
  var rec={brand:f.brand.trim(),name:f.name.trim(),nameEn:(f.nameEn||"").trim(),
    country:f.country,process:f.process,notes:f.notes.slice(),
    subnotes:f.subnotes,subnotesEn:(f.subnotesEn||"").trim(),price:Number(f.price)||0};
  if(state.editId){
    var next=[],i;
    for(i=0;i<state.beans.length;i++){
      var b=state.beans[i];
      if(b.id===state.editId){
        var nb={};var k;for(k in b){if(b.hasOwnProperty(k))nb[k]=b[k];}
        for(k in rec){if(rec.hasOwnProperty(k))nb[k]=rec[k];}
        next.push(nb);
      }else next.push(b);
    }
    saveBeans(next);
    flash(t("msgEdited"));
  }else{
    rec.id="b_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
    rec.votes=0;rec.onSale=true;
    saveBeans(state.beans.concat([rec]));
    flash(t("msgAdded"));
  }
  state.editId=null;
  state.form=blankForm();
  render();
};
window.editBean=function(id){
  var b=null,i;
  for(i=0;i<state.beans.length;i++){if(state.beans[i].id===id){b=state.beans[i];break;}}
  if(!b)return;
  state.editId=id;
  state.form={brand:b.brand,name:b.name,nameEn:b.nameEn||"",country:b.country,process:b.process,
    notes:(b.notes||[]).slice(),subnotes:b.subnotes||"",subnotesEn:b.subnotesEn||"",price:b.price||""};
  render();
  setTimeout(function(){window.jumpTo("sec-add");},50);
};
window.cancelEdit=function(){state.editId=null;state.form=blankForm();render();};
window.delBean=function(id){
  var ok=true;
  try{ok=confirm(t("confirmDel"));}catch(e){ok=true;}
  if(!ok)return;
  var next=[],i;
  for(i=0;i<state.beans.length;i++){if(state.beans[i].id!==id)next.push(state.beans[i]);}
  saveBeans(next);
  if(state.editId===id)window.cancelEdit();
  flash(t("msgDeleted"));
};
window.adjust=function(id,d){
  var next=[],i;
  for(i=0;i<state.beans.length;i++){
    var b=state.beans[i];
    if(b.id===id){
      var nb={};var k;for(k in b){if(b.hasOwnProperty(k))nb[k]=b[k];}
      nb.votes=Math.max(0,(b.votes||0)+d);
      next.push(nb);
    }else next.push(b);
  }
  saveBeans(next);
};
window.toggleSale=function(id){
  var next=[],i;
  for(i=0;i<state.beans.length;i++){
    var b=state.beans[i];
    if(b.id===id){
      var nb={};var k;for(k in b){if(b.hasOwnProperty(k))nb[k]=b[k];}
      nb.onSale=!isOnSale(b);
      next.push(nb);
    }else next.push(b);
  }
  saveBeans(next);
};
window.setPatText=function(v){state.patText=v;};
window.runPattern=function(){
  var parsed=parsePattern(state.patText||"");
  if(!parsed.length){
    state.patMsg=t("patNone");render();
    setTimeout(function(){state.patMsg="";render();},3000);
    return;
  }
  saveBeans(state.beans.concat(parsed));
  state.patText="";
  state.patMsg=parsed.length+t("patResult");
  flash(parsed.length+t("patResult"));
  render();
  setTimeout(function(){state.patMsg="";render();},3000);
};
/* 요청 */
window.rForm=function(k,v){state.reqForm[k]=v;};
window.submitRequest=function(){
  var rf=state.reqForm;
  if(!rf.country){flash(t("reqNeedCountry"));return;}
  var last=Number(localStorage.getItem("cdn-lastreq")||"0");
  if(Date.now()-last<60000){flash(t("reqTooFast"));return;}
  var rec={
    id:"r_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
    country:rf.country, process:rf.process||"",
    brand:(rf.brand||"").trim().slice(0,40),
    comment:(rf.comment||"").trim().slice(0,120),
    ts:Date.now()
  };
  saveRequests(state.requests.concat([rec]));
  localStorage.setItem("cdn-lastreq",String(Date.now()));
  state.reqForm={country:"",process:"",brand:"",comment:""};
  flash(t("reqDone"));
};
window.delRequest=function(id){
  var next=[],i;
  for(i=0;i<state.requests.length;i++){if(state.requests[i].id!==id)next.push(state.requests[i]);}
  saveRequests(next);
  flash(t("reqDeleted"));
};
window.clearRequests=function(){
  var ok=true;
  try{ok=confirm(t("reqClearConfirm"));}catch(e){ok=true;}
  if(!ok)return;
  saveRequests([]);
  flash(t("reqDeleted"));
};
/* 영어 일괄 */
window.bulkField=function(id,key,val){
  if(!state.bulkEdits[id])state.bulkEdits[id]={};
  state.bulkEdits[id][key]=val;
};
window.bulkSaveAll=function(){
  var edits=state.bulkEdits||{};
  var next=[],i;
  for(i=0;i<state.beans.length;i++){
    var b=state.beans[i];
    var e=edits[b.id];
    if(!e){next.push(b);continue;}
    var nb={};var k;for(k in b){if(b.hasOwnProperty(k))nb[k]=b[k];}
    if(typeof e.nameEn==="string")nb.nameEn=e.nameEn.trim();
    if(typeof e.subnotesEn==="string")nb.subnotesEn=e.subnotesEn.trim();
    next.push(nb);
  }
  state.bulkEdits={};
  saveBeans(next);
  flash(t("bulkSaved"));
};
window.bulkAutoNotes=function(){
  var n=0;
  var next=[],i;
  for(i=0;i<state.beans.length;i++){
    var b=state.beans[i];
    if((!b.subnotesEn||!b.subnotesEn.trim())&&b.subnotes&&b.subnotes.trim()){
      var conv=autoTranslateNotes(b.subnotes);
      if(conv&&conv.trim()){
        var nb={};var k;for(k in b){if(b.hasOwnProperty(k))nb[k]=b[k];}
        nb.subnotesEn=conv;
        next.push(nb);n++;
        continue;
      }
    }
    next.push(b);
  }
  if(!n){flash(t("bulkAutoNone"));return;}
  state.bulkEdits={};
  saveBeans(next);
  flash(n+t("bulkAutoDone"));
};
/* 로고·브랜드 */
window.uploadLogo=function(brand,e){
  var file=e.target.files&&e.target.files[0];
  e.target.value="";
  if(!file)return;
  if(file.type!=="image/png"){flash(t("logoErr"));return;}
  compressLogo(file,function(dataUrl){
    if(!dataUrl){flash(t("logoErr"));return;}
    var next={};var k;
    for(k in state.brandLogos){if(state.brandLogos.hasOwnProperty(k))next[k]=state.brandLogos[k];}
    next[brand]=dataUrl;
    saveLogos(next);
    flash(t("logoSaved"));
  });
};
window.removeLogo=function(brand){
  var next={};var k;
  for(k in state.brandLogos){if(state.brandLogos.hasOwnProperty(k)&&k!==brand)next[k]=state.brandLogos[k];}
  saveLogos(next);
  flash(t("logoRemoved"));
};
window.saveBrandEnName=function(brand,val){
  var next={};var k;
  for(k in state.brandNamesEn){if(state.brandNamesEn.hasOwnProperty(k))next[k]=state.brandNamesEn[k];}
  var v=(val||"").trim();
  if(v)next[brand]=v;else delete next[brand];
  saveBrandEn(next);
  flash(t("brandEnSaved"));
};
/* 백업 */
window.exportJSON=function(){
  var payload={beans:state.beans,brandLogos:state.brandLogos,brandNamesEn:state.brandNamesEn,
    requests:state.requests,exportedAt:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="cafe-dennis-beans-"+new Date().toISOString().slice(0,10)+".json";
  a.click();URL.revokeObjectURL(a.href);
  flash(t("msgExported"));
};
window.importJSON=function(e){
  var file=e.target.files&&e.target.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var data=JSON.parse(r.result);
      var arr=Object.prototype.toString.call(data)==="[object Array]"?data:data.beans;
      if(Object.prototype.toString.call(arr)!=="[object Array]")throw new Error("bad");
      var next=[],i;
      for(i=0;i<arr.length;i++){
        var d=arr[i];if(!d)continue;
        var nb={votes:0,notes:[]};var k;
        for(k in d){if(d.hasOwnProperty(k))nb[k]=d[k];}
        if(!nb.id)nb.id="b_"+Math.random().toString(36).slice(2);
        next.push(nb);
      }
      saveBeans(next);
      if(data&&data.brandLogos&&typeof data.brandLogos==="object")saveLogos(data.brandLogos);
      if(data&&data.brandNamesEn&&typeof data.brandNamesEn==="object")saveBrandEn(data.brandNamesEn);
      if(data&&Object.prototype.toString.call(data.requests)==="[object Array]")saveRequests(data.requests);
      flash(t("msgImported"));
    }catch(err){flash(t("msgImportFail"));}
  };
  r.readAsText(file);
  e.target.value="";
};

  var btn=document.getElementById("topBtn");
  if(!btn)return;
  if(window.scrollY>500)btn.classList.add("show");
  else btn.classList.remove("show");
