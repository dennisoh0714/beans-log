<style>
  :root{
    --black:#121113; --panel:#1b191a; --panel2:#232021; --border:#35302d;
    --ink:#f4f1ea; --sub:#a8a29a; --metal:#bcbfc3; --metalDark:#6f7276;
    --walnut:#6b4a32; --walnutLt:#9a6f4d; --amber:#cf954f; --danger:#c0524e;
    --green:#5fd17e; --greenBg:#1e3a24; --greenBd:#2f6b3f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--black);color:var(--ink);overflow-x:hidden;
    font-family:"Pretendard Variable",Pretendard,ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-text-size-adjust:100%;}
  .wrap{max-width:980px;margin:0 auto;padding:16px;
    padding-left:calc(16px + env(safe-area-inset-left));
    padding-right:calc(16px + env(safe-area-inset-right));
    padding-bottom:calc(28px + env(safe-area-inset-bottom));}
  @media(min-width:640px){.wrap{padding:24px;}}
  button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  input,select,textarea{font-family:inherit;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;}
  [id^="sec-"],#listtop{scroll-margin-top:78px;}
  h2.sec{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;}
  .muted{color:var(--metalDark);font-size:11px;line-height:1.5;}
  .hidden{display:none!important;}
  /* 토스트 */
  #toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-140px) scale(.8);
    z-index:100;background:var(--walnut);color:var(--ink);border:1px solid var(--walnutLt);
    padding:11px 18px;border-radius:11px;font-size:13px;font-weight:700;
    box-shadow:0 6px 20px rgba(0,0,0,.5);transition:transform .5s cubic-bezier(.2,1.6,.35,1);max-width:90vw;text-align:center;}
  #toast.show{transform:translateX(-50%) translateY(0) scale(1);}
  /* 헤더 */
  header{background:linear-gradient(135deg,#232021,#161415);border:1px solid var(--border);
    border-radius:18px;padding:20px;margin-bottom:14px;}
  .hdrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .brandlock{min-width:0;}
  .wordmark{height:27px;width:auto;display:block;margin-bottom:10px;opacity:.97;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.5));}
  h1{font-size:21px;font-weight:800;letter-spacing:-.4px;}
  @media(min-width:640px){h1{font-size:24px;}}
  .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.22em;color:var(--amber);margin-bottom:4px;}
  .tagline{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.5;word-break:keep-all;}
  .langbtn{font-size:13px;font-weight:700;padding:8px 12px;border-radius:9px;
    background:var(--panel2);color:var(--sub);border:1px solid var(--border);
    display:flex;align-items:center;gap:5px;transition:background .12s,color .12s;}
  .langbtn.on{background:var(--walnut);color:var(--ink);border-color:var(--walnutLt);}
  .langflag{font-size:18px;line-height:1;}
  .lsglobe{font-size:16px;line-height:1;margin-right:2px;opacity:.85;}
  .langwrap{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center;}
  /* 모바일: 언어 버튼 4개를 한 줄에 균등 배치 */
  @media(max-width:560px){
    header{padding:16px;}
    .langwrap{width:100%;flex-wrap:nowrap;gap:5px;margin-top:2px;}
    .lsglobe{display:none;}
    .langbtn{flex:1;min-width:0;justify-content:center;padding:8px 2px;
      font-size:12px;letter-spacing:-.3px;gap:3px;}
    .langbtn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .langflag{font-size:14px;}
    .votehint{padding:12px 13px;gap:11px;}
    .votehint .vhicon{font-size:20px;}
    .votehint b{font-size:13.5px;}
    .votehint span{font-size:12px;}
    .tab{padding:8px 12px;font-size:13.5px;}
    /* ===== 모바일 특화 ===== */
    /* iOS는 16px 미만 입력에 포커스하면 화면을 확대해버린다 */
    .searchbox input,input.fi,select.fi,textarea.fi,.bulkrow input,.sel{font-size:16px;}
    .sel{padding:9px 10px;}
    .searchbox input{padding:11px 0;}
    /* 터치 타깃 최소 44px 확보 */
    .votebtn{padding:12px 18px;font-size:14px;}
    .chip{padding:10px 14px;font-size:13px;}
    .icobtn{width:40px;height:40px;font-size:16px;}
    .stepbtn{width:38px;height:38px;font-size:17px;}
    .morebtn{padding:16px;font-size:14px;}
    .reqnudgebtn{padding:11px 16px;}
    /* 정렬·필터 칩 줄: 줄바꿈 대신 가로 스와이프 (검색줄은 제외) */
    .sortbar.swipe{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;
      scroll-snap-type:x proximity;padding-bottom:3px;
      -webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);
      mask-image:linear-gradient(90deg,#000 92%,transparent);}
    .sortbar.swipe::-webkit-scrollbar{display:none;}
    .sortbar.swipe>*{flex-shrink:0;scroll-snap-align:start;}
    /* 카드 여백·제목 최적화 */
    .tabbar{margin-left:calc(-16px - env(safe-area-inset-left));
      margin-right:calc(-16px - env(safe-area-inset-right));
      padding-left:calc(16px + env(safe-area-inset-left));
      padding-right:calc(16px + env(safe-area-inset-right));}
    header{border-radius:16px;}
    h1{font-size:20px;line-height:1.25;}
    .wordmark{height:22px;margin-bottom:8px;}
    .eyebrow{font-size:9.5px;letter-spacing:.16em;}
    .bean{padding:16px;}
    .beans{gap:12px;}
  }
  /* 투표 방법 안내 배너 */
  .votehint{display:flex;align-items:center;gap:14px;
    background:linear-gradient(135deg,#2a2118,#1c1712);
    border:1px solid rgba(207,149,79,.35);border-radius:14px;
    padding:14px 16px;margin-bottom:16px;}
  .votehint .vhicon{font-size:26px;line-height:1;color:#ff8e8e;flex-shrink:0;
    animation:vhbeat 1.6s ease-in-out infinite;}
  .votehint b{display:block;font-size:14.5px;color:var(--amber);margin-bottom:3px;word-break:keep-all;}
  .votehint span{font-size:12.5px;color:var(--sub);line-height:1.55;word-break:keep-all;}
  @keyframes vhbeat{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
  @media(prefers-reduced-motion:reduce){.votehint .vhicon{animation:none;}}
  /* ===== 모션 시스템: 레터프레스처럼 '꾹' 눌리고 정착하는 느낌 ===== */
  @keyframes fadeUp{from{opacity:0;transform:translateY(30px) scale(.96);}55%{opacity:1;}to{opacity:1;transform:none;}}
  @keyframes cardIn{0%{opacity:0;transform:translateY(38px) scale(.88) rotate(-1.5deg);}65%{opacity:1;transform:translateY(-6px) scale(1.03) rotate(.4deg);}100%{opacity:1;transform:none;}}
  @keyframes heartPop{0%{transform:scale(1);}30%{transform:scale(2.4) rotate(-18deg);}55%{transform:scale(.75) rotate(8deg);}78%{transform:scale(1.35) rotate(-4deg);}100%{transform:scale(1);}}
  @keyframes plusFloat{0%{opacity:0;transform:translateY(6px) scale(.5);}20%{opacity:1;transform:translateY(-6px) scale(1.5);}45%{transform:translateY(-22px) scale(1.15);}100%{opacity:0;transform:translateY(-56px) scale(.85);}}
  @keyframes tabSettle{0%{transform:scale(.82);}45%{transform:scale(1.14);}72%{transform:scale(.96);}100%{transform:none;}}
  .tabpane.anim{animation:fadeUp .55s cubic-bezier(.2,1.1,.3,1) both;}
  .tabpane.anim .votehint{animation:cardIn .6s .05s cubic-bezier(.2,1.2,.3,1) both;}
  .tabpane.anim .stat{animation:cardIn .58s cubic-bezier(.2,1.2,.3,1) both;}
  .tabpane.anim .stat:nth-child(2){animation-delay:.09s;}
  .tabpane.anim .stat:nth-child(3){animation-delay:.18s;}
  .tabpane.anim .stat:nth-child(4){animation-delay:.27s;}
  .tabpane.anim .bean,.tabpane.anim .stat,.tabpane.anim .card{will-change:transform,opacity;}
  .tabpane.anim .bean{animation:cardIn .62s cubic-bezier(.2,1.1,.3,1) both;}
  @keyframes titleIn{
    0%{opacity:0;transform:translateY(38px) scale(.93);filter:blur(12px);letter-spacing:.14em;}
    55%{opacity:1;filter:blur(0);}
    100%{opacity:1;transform:none;filter:blur(0);letter-spacing:0;}}
  .boot header h1{animation:titleIn 1.05s .18s cubic-bezier(.2,1.15,.3,1) both;}
  .boot header .tagline{animation:fadeUp .95s .5s cubic-bezier(.2,1.2,.3,1) both;}
  .boot header .langwrap{animation:fadeUp .9s .62s cubic-bezier(.2,1.2,.3,1) both;}
  .boot .langwrap .langbtn{animation:cardIn .7s cubic-bezier(.2,1.4,.3,1) both;}
  .boot .langwrap .langbtn:nth-of-type(1){animation-delay:.78s;}
  .boot .langwrap .langbtn:nth-of-type(2){animation-delay:.86s;}
  .boot .langwrap .langbtn:nth-of-type(3){animation-delay:.94s;}
  .boot .langwrap .langbtn:nth-of-type(4){animation-delay:1.02s;}
  /* 헤더 광택 스윕 — 활자가 정착한 뒤 한 번 */
  .boot header{position:relative;overflow:hidden;}
  .boot header::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.09) 50%,transparent 60%);
    transform:translateX(-120%);animation:introSheen 1.2s 1.5s ease-out both;}
  /* 본문 블록도 커튼이 걷힌 뒤 여유 있게 */
  .boot .tabbar{animation:fadeUp .8s .72s cubic-bezier(.2,1.2,.3,1) both;}
  .boot .tabpane.anim{animation-delay:.85s;}
  .boot .tabpane.anim .votehint{animation-delay:1s;}
  .boot .tabpane.anim .stat{animation-delay:1.12s;}
  .boot .tabpane.anim .stat:nth-child(2){animation-delay:1.26s;}
  .boot .tabpane.anim .stat:nth-child(3){animation-delay:1.4s;}
  .boot .tabpane.anim .stat:nth-child(4){animation-delay:1.54s;}
  .boot .tabpane.anim .medal{animation-delay:2.05s;}
  /* 모션 2단계: 활자 조판·스탬프·파티클 */
  @keyframes stampIn{0%{opacity:0;transform:scale(2.8) rotate(-16deg);}55%{opacity:1;transform:scale(.82) rotate(4deg);}78%{transform:scale(1.1) rotate(-2deg);}100%{opacity:1;transform:none;}}
  @keyframes letterDrop{0%{opacity:0;transform:translateY(-22px) scale(1.5) rotate(-8deg);}60%{opacity:1;transform:translateY(3px) scale(.92);}100%{opacity:1;transform:none;}}
  @keyframes medalWiggle{0%,100%{transform:rotate(0) scale(1);}20%{transform:rotate(-24deg) scale(1.35);}45%{transform:rotate(20deg) scale(1.25);}70%{transform:rotate(-10deg) scale(1.1);}}
  @keyframes dotPulse{0%,100%{transform:scale(1);opacity:1;box-shadow:0 0 0 0 rgba(95,209,126,.55);}50%{transform:scale(1.75);opacity:.7;box-shadow:0 0 0 6px rgba(95,209,126,0);}}
  @keyframes softFade{0%{opacity:0;transform:translateY(16px) scale(.97);}100%{opacity:1;transform:none;}}
  @keyframes heartFly{
    0%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.4) rotate(var(--rot));}}
  @keyframes loadDot{0%,100%{transform:translateY(0) scale(1);opacity:.35;}40%{transform:translateY(-18px) scale(1.3);opacity:1;}}
  .eyebrow span{display:inline-block;}
  .boot .eyebrow span{animation:letterDrop .62s cubic-bezier(.2,1.6,.4,1) both;}
  .boot .wordmark{animation:stampIn 1.05s cubic-bezier(.2,1.7,.35,1) both;}
  .tabpane.anim .card{animation:cardIn .58s cubic-bezier(.2,1.2,.3,1) both;}
  .tabpane.anim .medal{display:inline-block;animation:medalWiggle .9s .5s cubic-bezier(.3,1.4,.4,1) both;}
  .nowdot{animation:dotPulse 2s ease-in-out infinite;}
  .beans.soft{animation:softFade .4s cubic-bezier(.2,1.1,.3,1) both;}
  .chip.settle{animation:tabSettle .42s cubic-bezier(.3,1.5,.4,1);}
  .heartfly{position:absolute;left:50%;top:50%;pointer-events:none;color:#ff8e8e;
    text-shadow:0 0 8px rgba(255,142,142,.5);
    animation:heartFly 1s cubic-bezier(.15,.8,.3,1) both;}
  @keyframes vringPop{0%{opacity:.9;transform:translate(-50%,-50%) scale(.2);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(3.2);}}
  .vring{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;
    border:2.5px solid #ff8e8e;pointer-events:none;animation:vringPop .7s cubic-bezier(.1,.7,.3,1) both;}
  .loaddots{display:inline-flex;gap:6px;margin-bottom:12px;}
  .loaddots span{width:12px;height:12px;border-radius:50%;background:var(--amber);
    animation:loadDot 1s cubic-bezier(.3,1.2,.4,1) infinite;}
  .loaddots span:nth-child(2){animation-delay:.15s;}
  .loaddots span:nth-child(3){animation-delay:.3s;}
  /* ===== 오프닝 커튼 ===== */
  #intro{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;

function autoTranslateNotes(ko){
  if(!ko)return "";
  var parts=String(ko).split(/([,，、·]\s*)/);
  var out=[],i;
  var keys=[];
  var kk;
  for(kk in FLAVOR_DICT){if(FLAVOR_DICT.hasOwnProperty(kk)){keys.push(kk);}}
  keys.sort(function(a,b){return b.length-a.length;});
  for(i=0;i<parts.length;i++){
    var seg=parts[i];
    if(/^[,，、·]/.test(seg)){out.push(seg);continue;}
    var w=seg.trim();
    if(!w){out.push(seg);continue;}
    if(FLAVOR_DICT[w]){out.push(FLAVOR_DICT[w]);continue;}
    var hit="";
    var j;
    for(j=0;j<keys.length;j++){
      if(w.indexOf(keys[j])>=0){hit=FLAVOR_DICT[keys[j]];break;}
    }
    out.push(hit||w);
  }
  return out.join("");
}

/* 첫 방문 시 브라우저 언어 자동 감지 (저장된 선택이 있으면 그것을 우선) */
function detectLang(){
  var saved=localStorage.getItem("cdn-lang");
  if(saved&&T[saved])return saved;
  var nav=((navigator.languages&&navigator.languages[0])||navigator.language||"ko").toLowerCase();
  if(nav.indexOf("ko")===0)return "ko";
  if(nav.indexOf("zh")===0)return "zh";
  if(nav.indexOf("th")===0)return "th";
  return "en";
}
var state={
  beans:null, brandLogos:{}, brandNamesEn:{}, requests:[],
  lang:detectLang(),
  myVotes:JSON.parse(localStorage.getItem("cdn-myvotes")||"[]"),
  tab:"dash", _tabAnim:true, _boot:true, sortKey:"votes", countryFilter:"", processFilter:"", saleFilter:false, myFilter:false, searchQ:"",
  nowExpand:false, listLimit:LIST_STEP, adminQ:"",
  authed:false, editId:null,
  form:{brand:"",name:"",nameEn:"",country:COUNTRIES[0].id,process:"Washed",notes:[],subnotes:"",subnotesEn:"",price:""},
  reqForm:{country:"",process:"",brand:"",comment:""},
  bulkEdits:{},
  patText:"", patMsg:"", fbReady:false
};
function t(k){return (T[state.lang]&&T[state.lang][k])||T.ko[k]||k;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmtPrice(n){return state.lang==="ko"?(n||0).toLocaleString()+"원":"₩"+(n||0).toLocaleString();}
function noteLabel(id,l){return NOTE_LABEL[id]?NOTE_LABEL[id][l]:id;}
function procLabel(id,l){return PROC_LABEL[id]?PROC_LABEL[id][l]:id;}
function countryName(id,l){return C_BY_ID[id]?C_BY_ID[id].names[l]:id;}
function beanName(b,l){return l==="ko"?(b.name||""):((b.nameEn&&b.nameEn.trim())?b.nameEn:(b.name||""));}
function brandName(brand,l){
  if(l==="ko")return brand;
  var en=state.brandNamesEn[brand];
  return (en&&en.trim())?en:brand;
}
function subnoteText(b,l){
  if(l==="ko")return b.subnotes||"";
  if(b.subnotesEn&&b.subnotesEn.trim())return b.subnotesEn;
  return autoTranslateNotes(b.subnotes||"");
}
function isOnSale(b){return b.onSale!==false;}
function flash(msg){
  var el=document.getElementById("toast");
  if(!el)return;
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(window._toastTm);
  window._toastTm=setTimeout(function(){el.classList.remove("show");},2200);
}

   Firebase

var beansRef=null, logosRef=null, reqRef=null, brandEnRef=null;
function initFirebase(){
  var cfg=FIREBASE_CONFIG;
  if(typeof firebase==="undefined"){
    /* 미리보기 등 외부 스크립트가 차단된 환경 — 로컬 데이터로 동작 */
    console.warn("Firebase SDK 미로드: 로컬 데이터 모드로 실행합니다.");
    state.fbReady=false; loadLocal(); return;
  }
  if(!cfg.apiKey||cfg.apiKey.indexOf("여기에")===0||!cfg.databaseURL){
    state.fbReady=false; loadLocal(); return;
  }
  try{
    firebase.initializeApp(cfg);
    var root=firebase.database().ref("cafeDennis");
    beansRef=root.child("beans");
    logosRef=root.child("brandLogos");
    brandEnRef=root.child("brandNamesEn");
    reqRef=root.child("requests");
    state.fbReady=true;
    beansRef.on("value",function(snap){
      var v=snap.val();
      if(v&&Object.prototype.toString.call(v)==="[object Array]"){state.beans=v.filter(Boolean);}
      else if(v&&typeof v==="object"){
        var arr=[],k;
        for(k in v){if(v.hasOwnProperty(k)&&v[k])arr.push(v[k]);}
        state.beans=arr;
      }
      else{state.beans=SEED.slice();beansRef.set(SEED);}
      render();
    },function(err){console.error("FB beans:",err);state.fbReady=false;loadLocal();});
    logosRef.on("value",function(snap){state.brandLogos=snap.val()||{};render();},
      function(err){console.error("FB logos:",err);});
    brandEnRef.on("value",function(snap){state.brandNamesEn=snap.val()||{};render();},
      function(err){console.error("FB brandEn:",err);});
    reqRef.on("value",function(snap){
      var v=snap.val();
      if(v&&Object.prototype.toString.call(v)==="[object Array]"){state.requests=v.filter(Boolean);}
      else if(v&&typeof v==="object"){
        var arr=[],k;
        for(k in v){if(v.hasOwnProperty(k)&&v[k])arr.push(v[k]);}
        state.requests=arr;
      }
      else{state.requests=[];}
      render();
    },function(err){console.error("FB requests:",err);});
  }catch(e){console.error(e);state.fbReady=false;loadLocal();}

   패턴 파싱 & 로고 압축
   ============================================================ */
function mapCountry(s){
  var k=(s||"").trim().toLowerCase();
  if(COUNTRY_ALIAS[k])return COUNTRY_ALIAS[k];
  var key;
  for(key in COUNTRY_ALIAS){
    if(COUNTRY_ALIAS.hasOwnProperty(key)&&k.indexOf(key)>=0)return COUNTRY_ALIAS[key];
  }
  return COUNTRIES[0].id;
}
function mapProcess(s){
  var k=(s||"").trim().toLowerCase().replace(/[\s()]/g,"");
  if(PROC_ALIAS[k])return PROC_ALIAS[k];
  var key;
  for(key in PROC_ALIAS){
    if(PROC_ALIAS.hasOwnProperty(key)&&k.indexOf(key)>=0)return PROC_ALIAS[key];
  }
  return "Other";
}
function mapNotes(s){
  var out=[];
  var parts=(s||"").split(/[,，、·]/);
  var i,key;
  for(i=0;i<parts.length;i++){
    var k=parts[i].trim().toLowerCase();
    if(!k)continue;
    if(NOTE_ALIAS[k]){if(out.indexOf(NOTE_ALIAS[k])<0)out.push(NOTE_ALIAS[k]);continue;}
    for(key in NOTE_ALIAS){
      if(NOTE_ALIAS.hasOwnProperty(key)&&k.indexOf(key)>=0){
        if(out.indexOf(NOTE_ALIAS[key])<0)out.push(NOTE_ALIAS[key]);
        break;
      }
    }
  }
  return out.slice(0,3);
}
function splitKoEn(s){
  var idx=(s||"").indexOf("/");
  if(idx<0)return [(s||"").trim(),""];
  return [s.slice(0,idx).trim(),s.slice(idx+1).trim()];
}
function parsePattern(text){
  var beans=[];
  var lines=text.split(/\r?\n/);
  var i;
  for(i=0;i<lines.length;i++){
    var ln=lines[i].trim();
    if(!ln)continue;
    var f=ln.split("|");
    var j;
    for(j=0;j<f.length;j++){f[j]=f[j].trim();}
    if(f.length<2||!f[0]||!f[1])continue;
    var nm=splitKoEn(f[1]);
    var sub=splitKoEn(f[5]||"");
    beans.push({
      id:"b_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
      brand:f[0], name:nm[0], nameEn:nm[1],
      country:mapCountry(f[2]||""),
      process:mapProcess(f[3]||""),
      notes:mapNotes(f[4]||""),
      subnotes:sub[0], subnotesEn:sub[1],
      price:Number((f[6]||"").replace(/[^\d]/g,""))||0,
      votes:0, onSale:true
    });
  }
  return beans;
}
function compressLogo(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var SZ=160;
      var cv=document.createElement("canvas");
      cv.width=SZ;cv.height=SZ;
      var ctx=cv.getContext("2d");
      var side=Math.min(img.width,img.height);
      var sx=(img.width-side)/2, sy=(img.height-side)/2;
      ctx.clearRect(0,0,SZ,SZ);
      ctx.drawImage(img,sx,sy,side,side,0,0,SZ,SZ);
      cb(cv.toDataURL("image/png"));
    };
    img.onerror=function(){cb(null);};
    img.src=fr.result;
  };
  fr.onerror=function(){cb(null);};
  fr.readAsDataURL(file);
}

function proj(lon,lat){return [(lon+180)*2,(90-lat)*2];}
function mapSVG(cstats,filter){
  var beltTop=(90-23.5)*2,beltBot=(90+23.5)*2;
  var s='<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">';
  s+='<defs><linearGradient id="wal" x1="0" y1="0" x2="0" y2="1">'+
     '<stop offset="0%" stop-color="#9a6f4d"/><stop offset="100%" stop-color="#6b4a32"/></linearGradient>'+
     '<radialGradient id="mbg" cx="50%" cy="45%" r="75%">'+
     '<stop offset="0%" stop-color="#1f1c1d"/><stop offset="100%" stop-color="#141213"/></radialGradient></defs>';
  s+='<rect width="720" height="360" fill="url(#mbg)"/>';
  var xs=[60,120,180,240,300,360,420,480,540,600,660],i;
  for(i=0;i<xs.length;i++){s+='<line x1="'+xs[i]+'" y1="0" x2="'+xs[i]+'" y2="360" stroke="#35302d" stroke-width="0.5" opacity="0.5"/>';}
  var ys=[60,120,180,240,300];
  for(i=0;i<ys.length;i++){s+='<line x1="0" y1="'+ys[i]+'" x2="720" y2="'+ys[i]+'" stroke="#35302d" stroke-width="0.5" opacity="0.5"/>';}
  s+='<rect x="0" y="'+beltTop+'" width="720" height="'+(beltBot-beltTop)+'" fill="#cf954f" opacity="0.07"/>';
  s+='<line x1="0" y1="'+beltTop+'" x2="720" y2="'+beltTop+'" stroke="#cf954f" stroke-width="0.7" stroke-dasharray="4 4" opacity="0.5"/>';
  s+='<line x1="0" y1="'+beltBot+'" x2="720" y2="'+beltBot+'" stroke="#cf954f" stroke-width="0.7" stroke-dasharray="4 4" opacity="0.5"/>';
  s+='<text x="710" y="'+(beltTop+14)+'" text-anchor="end" font-size="10" fill="#cf954f" opacity="0.7" letter-spacing="1">COFFEE BELT</text>';
  var key;
  for(key in CONT){
    if(CONT.hasOwnProperty(key)){
      var pts="",p=CONT[key],j;
      for(j=0;j<p.length;j++){
        var xy=proj(p[j][0],p[j][1]);
        pts+=(j?" ":"")+xy[0]+","+xy[1];
      }
      s+='<polygon points="'+pts+'" fill="#6f7276" opacity="0.22" stroke="#bcbfc3" stroke-width="0.6" stroke-opacity="0.4"/>';
    }
  }
  for(i=0;i<cstats.length;i++){
    var cs=cstats[i];
    var xy2=proj(cs.lon,cs.lat);
    var r=5+Math.sqrt(cs.votes)*2.1;
    var active=filter===cs.id;
    s+='<g style="cursor:pointer" onclick="window.pickCountry(\''+cs.id+'\')">';
    if(active)s+='<circle cx="'+xy2[0]+'" cy="'+xy2[1]+'" r="'+(r+6)+'" fill="#cf954f" opacity="0.3"/>';
    s+='<circle cx="'+xy2[0]+'" cy="'+xy2[1]+'" r="'+r+'" fill="url(#wal)" stroke="'+(active?"#cf954f":"#bcbfc3")+'" stroke-width="'+(active?2:1.3)+'"/>';
    s+='<text x="'+xy2[0]+'" y="'+(xy2[1]+r+12)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#f4f1ea">'+esc(cs.name)+'</text>';
    s+='<text x="'+xy2[0]+'" y="'+(xy2[1]+r+23)+'" text-anchor="middle" font-size="9.5" fill="#cf954f">&#9829; '+cs.votes+' &#183; '+cs.count+esc(t("unitKind"))+'</text>';
    s+='</g>';
  }
  s+='</svg>';
  return s;
}

function renderDash(){
  var l=state.lang, beans=state.beans;

  var sorted=beans.slice().sort(function(a,b){return (b.votes||0)-(a.votes||0);});
  var top=sorted[0];
  var onSaleCnt=0;
  for(i=0;i<beans.length;i++){if(isOnSale(beans[i]))onSaleCnt++;}

  var topVal=top?'<span style="font-size:15px">'+esc(beanName(top,l))+'</span>':"-";

      '<span>'+esc(t("voteHintDesc"))+'</span></div></div>';

    statCard("&#9829;",t("statVotes"),totalVotes,"")+
    statCard("&#127942;",t("statTop"),topVal,top?esc(brandName(top.brand,l))+" &#183; &#9829;"+(top.votes||0):"")+
    '</div>';

  /* 판매중 섹션 (인기순 + TOP3 메달 + 접기) */
  var onSaleBeans=[];
  for(i=0;i<beans.length;i++){if(isOnSale(beans[i]))onSaleBeans.push(beans[i]);}
  onSaleBeans.sort(function(a,b){return (b.votes||0)-(a.votes||0);});
  h+='<div class="nowsec">'+
     '<h2 class="sec" style="margin-bottom:10px;color:#5fd17e">&#9749; '+esc(t("nowTitle"))+
     ' <span style="color:#3f8a52;font-weight:600">('+onSaleBeans.length+t("unitKind")+')</span></h2>';
  if(!onSaleBeans.length){
    h+='<p class="muted">'+esc(t("nowEmpty"))+'</p>';

    h+='<div class="beans">';
    var medals=["&#129351;","&#129352;","&#129353;"];
    for(i=0;i<showList.length;i++){
      h+=beanCardHtml(showList[i],l,i<3?medals[i]:"");
    }
    h+='</div>';
    if(onSaleBeans.length>NOW_PREVIEW){
      h+='<button class="morebtn green" onclick="window.toggleNowExpand()">'+
         (state.nowExpand?("&#9650; "+esc(t("nowLess"))):("&#9660; "+esc(t("nowMore"))+" ("+onSaleBeans.length+t("unitKind")+")"))+
         '</button>';
    }
  }
  h+='</div>';

  /* 랭킹 차트 · 지도 — 정렬/목록을 위로 올리기 위해 뒤로 미뤄 출력 */
  var secTail="";

     '<h2 class="sec" style="margin-bottom:12px">&#128200; '+esc(t("rankTitle"))+'</h2>';
  for(i=0;i<cd.length;i++){
    var w=Math.round((cd[i].votes||0)/max*100);
    secTail+='<div class="barrow"><div class="barlabel">'+esc(beanName(cd[i],l))+'</div>'+
       '<div class="bartrack"><div class="barfill" style="width:'+Math.max(w,4)+'%;background:'+(i===0?"#cf954f":"#9a6f4d")+'">'+(cd[i].votes||0)+'</div></div></div>';
  }
  secTail+='</div>';

  /* 지도 */

    cm[b.country].votes+=(b.votes||0);cm[b.country].count++;

  var cstats=[],k;
  for(k in cm){if(cm.hasOwnProperty(k))cstats.push(cm[k]);}
  secTail+='<div class="card" style="padding:16px;margin-bottom:16px" id="mapsec">'+
     '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px">'+

      /* 이름·브랜드 + 생산지·가공법·향미·세부 노트까지 검색 (표시 언어 + 한/영) */

        subnoteText(bb,l)||"",bb.subnotes||"",bb.subnotesEn||""];

      for(ni=0;ni<nn.length;ni++){hp.push(noteLabel(nn[ni],l),noteLabel(nn[ni],"ko"),noteLabel(nn[ni],"en"));}
      if(hp.join(" ").toLowerCase().indexOf(q)<0)continue;
    }
    view.push(bb);
  }
  var cmps={
    votes:function(a,b){return (b.votes||0)-(a.votes||0);},
    brand:function(a,b){return a.brand.localeCompare(b.brand,"ko");},
    country:function(a,b){return countryName(a.country,l).localeCompare(countryName(b.country,l));},

    price:function(a,b){return (a.price||0)-(b.price||0);}

  view.sort(cmps[state.sortKey]||cmps.votes);

  /* 결과 개수 + 검색·필터 지우기 */
  var hasFilter=!!(q||state.countryFilter||state.processFilter||state.saleFilter||state.myFilter);
  h+='<div class="resultbar" id="listtop"><span>'+esc(t("resultCount").replace("{n}",view.length))+'</span>'+
     (hasFilter?'<button class="chip" onclick="window.clearFilters()">&#10005; '+esc(t("clearFilters"))+'</button>':"")+

  var shown=view.slice(0,state.listLimit);
  h+='<div class="beans" style="padding-bottom:8px">';

/* 등장 애니메이션 종료 후 정리 —
   fill 상태가 남아 있으면 카드 호버 리프트 같은 이후 변형을 덮어쓴다 */
function scheduleCleanup(app,delay){
  clearTimeout(state._animTm);
  state._animTm=setTimeout(function(){
    var pn=app.querySelector(".tabpane.anim"),j;
    if(pn)pn.classList.remove("anim");
    var sf=app.querySelectorAll(".beans.soft");
    for(j=0;j<sf.length;j++)sf[j].classList.remove("soft");
    var iv=app.querySelectorAll(".bean[style*='animation'],.card[style*='animation']");
    for(j=0;j<iv.length;j++){iv[j].style.animation="";iv[j].style.animationDelay="";}
  },delay);
}

/* 아이브로우 글자별 span (부트 캐스케이드용) */
function eyebrowSpans(txt){
  var o="",i,ch;
  for(i=0;i<txt.length;i++){
    ch=txt.charAt(i)===" "?"&nbsp;":esc(txt.charAt(i));
    o+='<span style="animation-delay:'+(i*38)+'ms">'+ch+'</span>';
  }
  return o;
}

/* 통계 숫자 카운트업 (탭 진입 시 1회) */
function countUpStats(pane){
  if(!pane)return;
  var els=pane.querySelectorAll(".stat .val"),i;
  for(i=0;i<els.length;i++)(function(el){
    var m=/^(\d[\d,]*)(.*)$/.exec(el.textContent||"");
    if(!m)return;
    var target=parseInt(m[1].replace(/,/g,""),10),suf=m[2]||"";
    if(!target||target<2)return;
    var t0=null;
    function step(ts){
      if(t0===null)t0=ts;
      var p=Math.min((ts-t0)/1400,1),e=1-Math.pow(1-p,4);
      el.textContent=Math.round(target*e)+suf;
      if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })(els[i]);
}

(function(){
  var iv=document.getElementById("intro");
  var il=iv&&iv.querySelector(".intrologo");
  if(il)il.src=LOGO;
  var t0=Date.now(),MIN=2000,MAX=4500;
  function done(){
    if(window._introGone)return;
    window._introGone=true;
    if(iv){
      iv.classList.add("out");
      setTimeout(function(){if(iv.parentNode)iv.parentNode.removeChild(iv);},900);
    }
    if(window._bootStart){var f=window._bootStart;window._bootStart=null;f();}
  }
  if(!iv){window._introGone=true;return;}
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){done();return;}
  iv.addEventListener("click",done);          /* 탭하면 건너뛰기 */
  (function tick(){
    var el=Date.now()-t0;
    if((state.beans&&el>=MIN)||el>=MAX){done();return;}
    setTimeout(tick,120);
  })();
})();

window.vote=function(id){
  var voted=state.myVotes.indexOf(id)>=0;
  var delta=voted?-1:1;
  var next=[],i;
  for(i=0;i<state.beans.length;i++){
    var b=state.beans[i];
    if(b.id===id){
      var nb={};var k;for(k in b){if(b.hasOwnProperty(k))nb[k]=b[k];}
      nb.votes=Math.max(0,(b.votes||0)+delta);
      next.push(nb);
    }else next.push(b);
  }
  state.beans=next;
  if(state.fbReady&&beansRef){beansRef.set(next).catch(function(e){console.error(e);});}
  else{localStorage.setItem("cdn-beans",JSON.stringify(next));}
  if(voted){state.myVotes.splice(state.myVotes.indexOf(id),1);}
  else{state.myVotes.push(id);}
  localStorage.setItem("cdn-myvotes",JSON.stringify(state.myVotes));
  flash(t(voted?"voteUndo":"voteThanks"));
  render();
  /* 진동 피드백 (지원 기기에서만) */
  if(navigator.vibrate){try{navigator.vibrate(voted?12:[14,26,18]);}catch(e){}}
  /* 새로 렌더된 버튼에 포커스 복원 + 하트 팝/파티클 */
  var nb2=document.querySelector('.votebtn[data-bid="'+id+'"]');
  if(nb2&&nb2.focus){try{nb2.focus({preventScroll:true});}catch(e){}}
  if(!voted){
    var nb=nb2;
    if(nb){
      nb.classList.add("pop");
      var p1=document.createElement("span");
      p1.className="plus1";p1.textContent="+1";
      nb.appendChild(p1);
      /* 하트 파티클 6개가 사방으로 흩어짐 */
      var hi;
      for(hi=0;hi<10;hi++){
        var hf=document.createElement("span");
        hf.className="heartfly";hf.textContent="\u2665";
        var ang=(Math.PI*2*hi)/10+Math.random()*.5;
        hf.style.setProperty("--dx",Math.round(Math.cos(ang)*(58+Math.random()*42))+"px");
        hf.style.setProperty("--dy",Math.round(Math.sin(ang)*(50+Math.random()*34)-22)+"px");
        hf.style.setProperty("--rot",Math.round(Math.random()*180-90)+"deg");
        hf.style.fontSize=(14+Math.random()*10)+"px";
        nb.appendChild(hf);
      }
      var vr=document.createElement("span");
      vr.className="vring";nb.appendChild(vr);
      setTimeout(function(){
        nb.classList.remove("pop");
        if(p1.parentNode)p1.parentNode.removeChild(p1);
        if(vr.parentNode)vr.parentNode.removeChild(vr);
        var fl=nb.querySelectorAll(".heartfly"),fi;
        for(fi=0;fi<fl.length;fi++)if(fl[fi].parentNode)fl[fi].parentNode.removeChild(fl[fi]);
      },1150);
    }
  }

    var next={};var k;
    for(k in state.brandLogos){if(state.brandLogos.hasOwnProperty(k))next[k]=state.brandLogos[k];}
    next[brand]=dataUrl;
    saveLogos(next);
    flash(t("logoSaved"));
  });
};
window.removeLogo=function(brand){
  var next={};var k;
  for(k in state.brandLogos){if(state.brandLogos.hasOwnProperty(k)&&k!==brand)next[k]=state.brandLogos[k];}
  saveLogos(next);
  flash(t("logoRemoved"));
};
window.saveBrandEnName=function(brand,val){
  var next={};var k;
  for(k in state.brandNamesEn){if(state.brandNamesEn.hasOwnProperty(k))next[k]=state.brandNamesEn[k];}
  var v=(val||"").trim();
  if(v)next[brand]=v;else delete next[brand];
  saveBrandEn(next);
  flash(t("brandEnSaved"));
};
/* 백업 */
window.exportJSON=function(){
  var payload={beans:state.beans,brandLogos:state.brandLogos,brandNamesEn:state.brandNamesEn,
    requests:state.requests,exportedAt:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="cafe-dennis-beans-"+new Date().toISOString().slice(0,10)+".json";
  a.click();URL.revokeObjectURL(a.href);
  flash(t("msgExported"));
};
window.importJSON=function(e){
  var file=e.target.files&&e.target.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var data=JSON.parse(r.result);
      var arr=Object.prototype.toString.call(data)==="[object Array]"?data:data.beans;
      if(Object.prototype.toString.call(arr)!=="[object Array]")throw new Error("bad");
      var next=[],i;
      for(i=0;i<arr.length;i++){
        var d=arr[i];if(!d)continue;
        var nb={votes:0,notes:[]};var k;
        for(k in d){if(d.hasOwnProperty(k))nb[k]=d[k];}
        if(!nb.id)nb.id="b_"+Math.random().toString(36).slice(2);
        next.push(nb);
      }
      saveBeans(next);
      if(data&&data.brandLogos&&typeof data.brandLogos==="object")saveLogos(data.brandLogos);
      if(data&&data.brandNamesEn&&typeof data.brandNamesEn==="object")saveBrandEn(data.brandNamesEn);
      if(data&&Object.prototype.toString.call(data.requests)==="[object Array]")saveRequests(data.requests);
      flash(t("msgImported"));
    }catch(err){flash(t("msgImportFail"));}
  };
  r.readAsText(file);
  e.target.value="";
};

/* 맨 위로 버튼 */
window.addEventListener("scroll",function(){
  var btn=document.getElementById("topBtn");
  if(!btn)return;
  if(window.scrollY>500)btn.classList.add("show");
  else btn.classList.remove("show");
});

/* ============================================================
   시작
   ============================================================ */
state.tab=tabFromHash();
initFirebase();
render();
</script>
